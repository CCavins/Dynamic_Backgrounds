<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom theme preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; color: #fff; font-family: Inter, sans-serif; }
  #bar { position: fixed; top: 12px; left: 12px; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; max-width: 78%; }
  #bar button { min-height: 36px; padding: 6px 12px; border: 0; border-radius: 8px; background: #d52265; color: #fff; font: 500 13px Inter, sans-serif; cursor: pointer; }
  #bar button.aspect { background: #333; }
  #bar button.aspect.is-on { background: #fec651; color: #1b1b1b; }
  #bar .aspect-custom { display: flex; align-items: center; gap: 6px; background: #333; border-radius: 8px; padding: 0 8px; min-height: 36px; }
  #bar .aspect-custom input { width: 52px; height: 28px; border: 0; border-radius: 6px; background: #1b1b1b; color: #fff; text-align: center; font: 500 13px Inter, sans-serif; }
  #bar .aspect-custom.is-on { background: #fec651; color: #1b1b1b; }
  #bar .aspect-custom.is-on input { background: #fff; color: #1b1b1b; }
  #dyn-message-theme, #dyn-mosaic-theme { position: absolute; inset: 0; }
  #dyn-mosaic-theme { display: none; }
  body.mosaic #dyn-message-theme { display: none; }
  body.mosaic #dyn-mosaic-theme { display: block; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="dyn-message-theme"></div>
<div id="dyn-mosaic-theme"></div>
<script src="../extension/rules.js"></script>
<script src="../extension/message-themes.js"></script>
<script src="../extension/vendor/three.min.js"></script>
<script src="../extension/vendor/RoundedBoxGeometry.js"></script>
<script src="../extension/vendor/tile-field.js"></script>
<script src="../extension/mosaic-themes.js"></script>
<script src="../extension/engines/api.js"></script>
<script src="../extension/engines/xmas-snow-particles.js?v=1.16.3"></script>
<script src="../extension/engines/message-aurora-engine.js?v=1.16.3"></script>
<script src="../extension/engines/mosaic-orbit-swap-engine.js?v=1.16.3"></script>
<script src="../extension/engines/mosaic-xmas-wreath-engine.js?v=1.16.3"></script>
<script src="../extension/engines/mosaic-xmas-tree-engine.js?v=1.16.3"></script>
<script src="../extension/engines/mosaic-xmas-snowfall-engine.js?v=1.16.3"></script>
<script src="../extension/engines/message-xmas-bauble-engine.js?v=1.16.3"></script>
<script src="../extension/custom-themes.js"></script>
<script>
(async () => {
  const messageApi = globalThis.BGMessageThemes;
  const mosaicApi = globalThis.BGMosaicThemes;
  const customApi = globalThis.BGCustomThemes;
  const style = document.createElement("style");
  style.textContent = messageApi.STYLE + "\n" + mosaicApi.STYLE;
  document.head.appendChild(style);
  const fonts = document.createElement("link");
  fonts.rel = "stylesheet";
  fonts.href = messageApi.FONTS;
  document.head.appendChild(fonts);

  const files = [
    ["message-stamp.json", "Stamp message"],
    ["mosaic-ribbon.json", "Ribbon mosaic"],
    ["message-aurora.json", "Aurora engine"],
    ["mosaic-orbit-swap.json", "Orbit engine"],
    ["message-xmas-bauble.json", "Xmas Bauble"],
    ["message-xmas-postcard.json", "Xmas Postcard"],
    ["message-xmas-mantel.json", "Xmas Mantel"],
    ["mosaic-xmas-wreath.json", "Xmas Wreath"],
    ["mosaic-xmas-tree.json", "Xmas Tree"],
    ["mosaic-xmas-snowfall.json", "Xmas Snowfall"],
    ["tmpl-card-decks.json", "Card decks"],
    ["tmpl-live-mosaic.json", "Live mosaic"],
    ["tmpl-polaroid-wall.json", "Polaroid wall"],
    ["tmpl-neon-nightclub.json", "Neon Nightclub"],
    ["tmpl-led-scoreboard.json", "LED Scoreboard"],
    ["tmpl-liquid-glass.json", "Liquid Glass"],
    ["tmpl-parallax-drift.json", "Parallax Drift"],
  ];
  const rawPacks = await Promise.all(files.map(([file]) => fetch(file).then((r) => r.json())));
  const packs = rawPacks.map((raw) => customApi.parsePack(raw));
  customApi.registerPacks(packs);

  function mockPhoto(seed) {
    const c = document.createElement("canvas");
    c.width = 720; c.height = 960;
    const g = c.getContext("2d");
    const a = [210, 60 + seed * 20, 90];
    const b = [40, 80, 160 + seed * 8];
    const grad = g.createLinearGradient(0, 0, 720, 960);
    grad.addColorStop(0, `rgb(${a})`);
    grad.addColorStop(1, `rgb(${b})`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 720, 960);
    g.fillStyle = "rgba(255,255,255,.2)";
    g.beginPath();
    g.arc(360, 380, 140, 0, 7);
    g.fill();
    return c.toDataURL("image/jpeg", 0.85);
  }

  const photos = Array.from({ length: 8 }, (_, i) => mockPhoto(i));
  const messageRoot = document.getElementById("dyn-message-theme");
  const mosaicRoot = document.getElementById("dyn-mosaic-theme");
  const bar = document.getElementById("bar");
  const rules = globalThis.BGExtensionRules;
  let messageState = null;
  let mosaicState = null;
  let mosaicTimer = 0;
  let stageMode = "auto";
  let currentShow = null;

  function settingsFor(pack) {
    const out = { revealMs: pack.revealMs || 1000 };
    Object.keys(pack.settings || {}).forEach((key) => {
      out[key] = pack.settings[key].default;
    });
    return out;
  }

  function applyAspect() {
    if (rules && rules.setStageAspect) rules.setStageAspect(stageMode);
    if (rules && rules.applyStageFrame) {
      rules.applyStageFrame(mosaicRoot, stageMode);
      rules.applyStageFrame(messageRoot, stageMode);
    }
  }

  function showPack(pack) {
    currentShow = () => showPack(pack);
    if (mosaicTimer) {
      clearInterval(mosaicTimer);
      mosaicTimer = 0;
    }
    if (mosaicState && mosaicApi.themes[mosaicState.id] && mosaicApi.themes[mosaicState.id].unmount) {
      mosaicApi.themes[mosaicState.id].unmount(mosaicRoot, mosaicState.state);
    }
    mosaicRoot.replaceChildren();
    mosaicState = null;
    if (pack.kind === "mosaic") {
      if (messageState && messageApi.themes[messageState.id] && messageApi.themes[messageState.id].unmount) {
        messageApi.themes[messageState.id].unmount(messageRoot, messageState.state);
      }
      messageState = null;
      document.body.classList.add("mosaic");
      mosaicRoot.dataset.theme = pack.id;
      if (pack.engine) mosaicRoot.dataset.engine = pack.engine;
      else delete mosaicRoot.dataset.engine;
      applyAspect();
      const def = mosaicApi.themes[pack.id];
      if (!def) return;
      const api = {
        nextUrl() { return photos[Math.floor(Math.random() * photos.length)]; },
      };
      const state = def.mount(mosaicRoot, photos, api);
      mosaicState = { id: pack.id, state };
      if (def.tick) {
        mosaicTimer = setInterval(() => def.tick(mosaicRoot, photos, state, api), def.interval || pack.interval || 2400);
      }
      return;
    }
    applyAspect();
    if (messageState && messageApi.themes[messageState.id] && messageApi.themes[messageState.id].unmount) {
      messageApi.themes[messageState.id].unmount(messageRoot, messageState.state);
    }
    document.body.classList.remove("mosaic");
    messageRoot.dataset.theme = pack.id;
    if (pack.engine) messageRoot.dataset.engine = pack.engine;
    else delete messageRoot.dataset.engine;
    messageRoot.replaceChildren();
    const def = messageApi.themes[pack.id];
    if (!def) return;
    const settings = settingsFor(pack);
    const state = def.mount(messageRoot, settings);
    messageState = { id: pack.id, state };
    if (def.applySettings) def.applySettings(messageRoot, state, settings);
    def.show(messageRoot, {
      src: photos[0],
      message: "Wish you were here — the lights went on and the whole room went quiet.",
      name: "Sam & Jo",
    }, state, settings);
  }

  function addBtn(label, onClick, className) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = label;
    if (className) btn.className = className;
    btn.onclick = onClick;
    bar.appendChild(btn);
    return btn;
  }

  const aspectBtns = {};
  const customWrap = document.createElement("div");
  customWrap.className = "aspect-custom";
  const customW = document.createElement("input");
  const customH = document.createElement("input");
  customW.type = customH.type = "number";
  customW.min = customH.min = "1";
  customW.step = customH.step = "any";
  customW.value = "16";
  customH.value = "9";
  customW.title = "Width";
  customH.title = "Height";
  customWrap.append(customW, document.createTextNode(":"), customH);
  function markAspect(mode) {
    Object.keys(aspectBtns).forEach((key) => {
      aspectBtns[key].classList.toggle("is-on", key === mode);
    });
    customWrap.classList.toggle("is-on", mode === "custom");
  }
  function applyCustomAspect() {
    const next = rules && rules.normalizeStageAspect
      ? rules.normalizeStageAspect(customW.value + ":" + customH.value)
      : "auto";
    if (next === "auto") return;
    stageMode = next;
    markAspect("custom");
    if (currentShow) currentShow();
  }
  ["auto", "16:9", "9:16", "4:3", "1:1", "21:9"].forEach((mode) => {
    aspectBtns[mode] = addBtn(mode === "auto" ? "Auto" : mode, () => {
      stageMode = mode;
      markAspect(mode);
      if (mode !== "auto" && rules && rules.parseStageAspect) {
        const parsed = rules.parseStageAspect(mode);
        if (parsed && parsed.mode !== "auto") {
          customW.value = parsed.aw;
          customH.value = parsed.ah;
        }
      }
      if (currentShow) currentShow();
    }, "aspect");
  });
  bar.appendChild(customWrap);
  customW.addEventListener("change", applyCustomAspect);
  customH.addEventListener("change", applyCustomAspect);
  aspectBtns.auto.classList.add("is-on");

  files.forEach(([, label], i) => {
    addBtn(label, () => showPack(packs[i]));
  });

  [
    ["LED (built-in)", "message", "led-scoreboard"],
    ["Broadcast (built-in)", "message", "broadcast-tv"],
    ["Decks (built-in)", "mosaic", "decks"],
    ["Flipwall (built-in)", "mosaic", "flipwall"],
  ].forEach(([label, kind, id]) => {
    addBtn(label, () => {
      if (kind === "mosaic") {
        showPack({ kind: "mosaic", id, engine: "", interval: mosaicApi.themes[id] && mosaicApi.themes[id].interval });
        return;
      }
      const fake = { kind: "message", id, engine: "", settings: {}, revealMs: 1000 };
      showPack(fake);
    });
  });

  window.addEventListener("resize", () => {
    if (currentShow) currentShow();
  });
  showPack(packs[0]);
})();
</script>
</body>
</html>
