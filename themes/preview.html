<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dock-bg: rgba(12, 12, 18, 0.88);
    --dock-border: rgba(255, 255, 255, 0.12);
    --dock-text: #f4f4f7;
    --dock-muted: rgba(255, 255, 255, 0.55);
    --dock-accent: #d52265;
    --dock-focus: #fec651;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: var(--dock-text);
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 0;
    background: #05050c;
  }

  #preview-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
  }

  #preview-bg > img,
  #preview-bg > video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
  }

  #dyn-message-theme,
  #dyn-mosaic-theme {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    overflow: hidden;
    container-type: size;
  }

  /* Selected preview media sits inside the theme root, above that theme’s
     Background color and below cards/copy. Transparent PNG/GIF holes show
     the theme color through. */
  #dyn-message-theme > #preview-bg,
  #dyn-mosaic-theme > #preview-bg {
    z-index: 0;
    background: transparent;
  }

  body.has-preview-bg #dyn-message-theme > *:not(#preview-bg),
  body.has-preview-bg #dyn-mosaic-theme > *:not(#preview-bg) {
    z-index: 2;
  }

  /* Stage fills around cards stay clear so the selected media shows;
     the theme root keeps its Background color. */
  body.has-preview-bg #dyn-message-theme .dyn-fit-stage,
  body.has-preview-bg #dyn-message-theme .frame,
  body.has-preview-bg #dyn-message-theme .scene {
    background: transparent !important;
    background-image: none !important;
  }

  /* Keep grunge wall/grain layers — never strip .dyn-stage or .wall (brick texture). */
  body.has-preview-bg #dyn-message-theme[data-theme="message-grunge-poster"] .dyn-stage {
    background: transparent !important;
  }

  /* Hide the inactive root only — never force display:block, or theme
     flex/grid layouts (decks, spotlight, etc.) lose to this rule. */
  body.is-mosaic #dyn-message-theme { display: none !important; }
  body:not(.is-mosaic) #dyn-mosaic-theme { display: none !important; }

  #dock {
    position: fixed;
    z-index: 40;
    left: 12px;
    right: 12px;
    bottom: 12px;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .dock-shell {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    max-width: min(760px, 100%);
    width: 100%;
  }

  .dock-toggle-row {
    display: none;
  }

  .dock-toggle {
    height: 32px;
    padding: 0 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--dock-muted);
    font: 600 11px Inter, system-ui, sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .dock-toggle:hover {
    color: var(--dock-text);
    background: rgba(255, 255, 255, 0.1);
  }

  .dock-panel {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 0;
    border: 1px solid var(--dock-border);
    border-radius: 16px;
    background: var(--dock-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  body.dock-collapsed .dock-shell {
    max-width: min(360px, 100%);
    width: auto;
    align-self: center;
    margin-inline: auto;
  }

  body.dock-collapsed .dock-panel {
    display: none;
  }

  body.dock-collapsed .dock-toggle-row {
    display: flex;
    justify-content: center;
  }

  .dock-chip {
    display: none;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding: 8px 14px 8px 16px;
    border: 1px solid var(--dock-border);
    border-radius: 999px;
    background: var(--dock-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    color: var(--dock-text);
    font: 500 13px Inter, system-ui, sans-serif;
    cursor: pointer;
  }

  .dock-chip strong {
    font-weight: 600;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dock-chip span {
    color: var(--dock-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  body.dock-collapsed .dock-chip {
    display: inline-flex;
  }

  body.dock-collapsed .dock-toggle {
    display: none;
  }

  .dock-row {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 10px 12px;
    padding: 12px 14px;
  }

  .dock-row + .dock-row,
  .dock-row + .dock-section {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .dock-row-browse {
    padding-top: 14px;
  }

  .dock-row-stage {
    padding-top: 10px;
    padding-bottom: 10px;
    background: rgba(255, 255, 255, 0.02);
  }

  .dock-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .dock-field > span {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dock-muted);
  }

  .dock-field-theme {
    flex: 1 1 220px;
    min-width: min(220px, 100%);
  }

  .dock-field-aspect {
    flex: 1 1 160px;
    min-width: 140px;
  }

  .dock-field-custom {
    flex: 0 0 auto;
    display: none;
  }

  .dock-field-custom.is-open {
    display: flex;
  }

  .dock-field-fit {
    flex: 1 1 160px;
    min-width: 140px;
  }

  .dock-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }

  .dock-actions-nav {
    display: flex;
    gap: 6px;
  }

  .dock-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px 14px;
  }

  .dock-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 24px;
  }

  .dock-section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dock-muted);
  }

  .dock-settings {
    display: none;
  }

  .dock-settings.is-open {
    display: flex;
  }

  .dock-settings-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px 14px;
  }

  .dock-bg-body {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(140px, 0.9fr);
    gap: 10px 14px;
    align-items: end;
  }

  .dock-bg .setting-row.media {
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
  }

  .dock-bg .media-head span:first-child {
    display: none;
  }

  .dock-bg .media-file-name {
    font-size: 12px;
    color: var(--dock-text);
    text-align: left;
    max-width: none;
  }

  .dock-bg .media-actions {
    margin-top: 2px;
  }

  .dock-bg .media-status:empty {
    display: none;
  }

  @media (max-width: 640px) {
    .dock-bg-body {
      grid-template-columns: 1fr;
    }

    .dock-actions {
      width: 100%;
      justify-content: space-between;
    }

    .dock-actions-nav {
      flex: 1;
    }

    .dock-actions-nav .dock-btn {
      flex: 1;
    }
  }

  .dock-panel select,
  .dock-panel input:not([type="color"]):not([type="range"]):not([type="file"]) {
    height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--dock-text);
    font: 500 13px Inter, system-ui, sans-serif;
    outline: none;
  }

  .dock-panel select {
    min-width: 0;
    width: 100%;
    padding: 0 34px 0 11px;
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, rgba(255,255,255,.7) 50%),
      linear-gradient(135deg, rgba(255,255,255,.7) 50%, transparent 50%);
    background-position:
      calc(100% - 16px) 15px,
      calc(100% - 10px) 15px;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }

  .dock-panel select:focus,
  .dock-panel input:focus {
    border-color: var(--dock-focus);
  }

  .dock-ratio {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dock-ratio input {
    width: 52px;
    text-align: center;
    padding: 0 4px;
  }

  .dock-ratio span {
    color: var(--dock-muted);
    font-size: 13px;
  }

  .setting-row {
    display: grid;
    grid-template-columns: minmax(64px, 0.9fr) minmax(72px, 1fr) 34px;
    gap: 6px;
    align-items: center;
  }

  .setting-row.media {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .dock-settings .setting-row.media {
    padding: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
  }

  .setting-row.select {
    grid-template-columns: minmax(64px, 0.9fr) minmax(0, 1.4fr);
  }

  .setting-row.select .theme-motion {
    grid-column: 2 / -1;
  }

  .setting-row.media .media-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .setting-row.media .media-file-name {
    font-size: 11px;
    color: var(--dock-muted);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 55%;
  }

  .setting-row.media .media-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .setting-row.media .media-actions .dock-btn {
    flex: 1 1 auto;
    margin: 0;
  }

  .setting-row.media .media-status {
    margin: 0;
    min-height: 0;
    font-size: 11px;
    color: var(--dock-muted);
  }

  .setting-row.media .media-status.is-error { color: #ff8b8b; }
  .setting-row.media .media-status.is-ok { color: #7dffb3; }

  .setting-row.scale {
    grid-template-columns: minmax(64px, 0.9fr) 1fr 40px;
  }
  .theme-scale { width: 100%; accent-color: var(--dock-accent); }
  .theme-scale-value {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--dock-muted);
  }

  .setting-row > span:first-child {
    font-size: 12px;
    font-weight: 500;
    color: var(--dock-muted);
  }

  .setting-row .theme-hex,
  .setting-row .theme-motion {
    height: 32px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--dock-text);
    font: 500 12px Inter, system-ui, sans-serif;
    outline: none;
  }

  .setting-row .theme-hex {
    width: 100%;
    padding: 0 8px;
  }

  .setting-row .theme-color {
    width: 34px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
  }

  .setting-row .theme-motion {
    width: 100%;
    padding: 0 10px;
  }

  .dock-btn {
    height: 36px;
    padding: 0 12px;
    border: 0;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--dock-text);
    font: 500 13px Inter, system-ui, sans-serif;
    cursor: pointer;
  }

  .dock-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .dock-btn-primary { background: var(--dock-accent); }
  .dock-btn-primary:hover { filter: brightness(1.08); }
  .dock-btn-ghost {
    height: 28px;
    padding: 0 10px;
    font-size: 12px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.14);
  }

  .dock-meta {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 40;
    max-width: min(420px, calc(100% - 32px));
    padding: 10px 12px;
    border: 1px solid var(--dock-border);
    border-radius: 12px;
    background: var(--dock-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .dock-meta strong {
    display: block;
    font-size: 14px;
    font-weight: 600;
  }

  .dock-meta p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--dock-muted);
  }

  .dock-meta a {
    color: #fec651;
    text-decoration: none;
  }

  .dock-meta a:hover { text-decoration: underline; }

  @media (max-width: 720px) {
    .dock-panel { width: 100%; }
  }
</style>
</head>
<body>
  <div id="stage" aria-hidden="true">
    <div id="preview-bg"></div>
    <div id="dyn-message-theme"></div>
    <div id="dyn-mosaic-theme"></div>
  </div>

  <aside class="dock-meta" id="meta">
    <strong id="meta-title">Theme preview</strong>
    <p id="meta-sub">Loading sample captures…</p>
  </aside>

  <div id="dock">
    <div class="dock-shell">
      <div class="dock-toggle-row">
        <button type="button" class="dock-chip" id="dock-chip" title="Expand tray">
          <strong id="dock-chip-label">Theme preview</strong>
          <span>Expand</span>
        </button>
      </div>
      <div class="dock-panel">
        <div class="dock-row dock-row-browse">
          <label class="dock-field dock-field-theme">
            <span>Theme</span>
            <select id="theme-select"></select>
          </label>
          <div class="dock-actions">
            <div class="dock-actions-nav">
              <button type="button" class="dock-btn" id="prev-theme" title="Previous theme">Prev</button>
              <button type="button" class="dock-btn dock-btn-primary" id="next-theme" title="Next theme">Next</button>
            </div>
            <button type="button" class="dock-toggle" id="dock-toggle" aria-expanded="true" title="Minimize tray">Min</button>
          </div>
        </div>

        <div class="dock-row dock-row-stage">
          <label class="dock-field dock-field-aspect">
            <span>Aspect ratio</span>
            <select id="aspect-select"></select>
          </label>
          <div class="dock-field dock-field-custom" id="custom-aspect">
            <span>Custom</span>
            <div class="dock-ratio">
              <input id="aspect-w" type="number" min="1" max="9999" step="any" inputmode="decimal" value="16" aria-label="Width">
              <span>:</span>
              <input id="aspect-h" type="number" min="1" max="9999" step="any" inputmode="decimal" value="9" aria-label="Height">
            </div>
          </div>
        </div>

        <div class="dock-section dock-settings" id="settings-panel" hidden>
          <div class="dock-section-head dock-settings-head">
            <span class="dock-section-title">Theme colors &amp; motion</span>
            <button type="button" class="dock-btn dock-btn-ghost" id="reset-settings">Reset</button>
          </div>
          <div class="dock-settings-fields" id="settings-fields"></div>
        </div>

        <div class="dock-section dock-bg" id="preview-bg-panel">
          <div class="dock-section-head">
            <span class="dock-section-title">Stage background</span>
          </div>
          <div class="dock-bg-body">
            <div class="setting-row media" id="preview-bg-media">
              <div class="media-head">
                <span>Stage background</span>
                <span class="media-file-name" id="preview-bg-name">No file</span>
              </div>
              <div class="media-actions">
                <label class="dock-btn">Choose file…<input type="file" id="preview-bg-file" accept="image/*,video/*,.gif" hidden></label>
                <button type="button" class="dock-btn dock-btn-ghost" id="preview-bg-clear">Clear</button>
              </div>
              <p class="media-status" id="preview-bg-status" role="status"></p>
            </div>
            <label class="dock-field dock-field-fit">
              <span>Fit</span>
              <select id="preview-bg-fit">
                <option value="cover">Fill — crop to cover</option>
                <option value="contain">Fit — letterbox</option>
                <option value="fill">Stretch</option>
                <option value="center">Center — native size</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="../extension/rules.js?v=1.23.6"></script>
<script src="../extension/media.js?v=1.23.6"></script>
<script src="../extension/message-themes.js?v=1.23.6"></script>
<script src="../extension/vendor/three.min.js"></script>
<script src="../extension/vendor/RoundedBoxGeometry.js"></script>
<script src="../extension/vendor/tile-field.js?v=1.23.6"></script>
<script src="../extension/mosaic-themes.js?v=1.23.6"></script>
<script src="../extension/engines/api.js"></script>
<script src="../extension/engines/xmas-snow-particles.js?v=1.23.6"></script>
<script src="../extension/engines/message-aurora-engine.js?v=1.23.6"></script>
<script src="../extension/engines/message-text-message-engine.js?v=1.23.6"></script>
<script src="../extension/engines/mosaic-orbit-swap-engine.js?v=1.23.6"></script>
<script src="../extension/engines/mosaic-xmas-wreath-engine.js?v=1.23.6"></script>
<script src="../extension/engines/mosaic-xmas-tree-engine.js?v=1.23.6"></script>
<script src="../extension/engines/mosaic-xmas-snowfall-engine.js?v=1.23.6"></script>
<script src="./mosaic-slant-rows-engine.js?v=1.23.6"></script>
<script src="../extension/engines/message-xmas-bauble-engine.js?v=1.23.6"></script>
<script src="../extension/custom-themes.js?v=1.23.6"></script>
<script>
(async () => {
  const SAMPLE_DIR = "../samples/patriots/";
  const CSV_URL = SAMPLE_DIR + "captures.csv";
  const MESSAGE_CYCLE_MS = 5600;

  const messageApi = globalThis.BGMessageThemes;
  const mosaicApi = globalThis.BGMosaicThemes;
  const customApi = globalThis.BGCustomThemes;
  const rules = globalThis.BGExtensionRules;
  if (!messageApi || !mosaicApi || !rules) return;

  // Match homepage tile previews: size against the stage box, not the window.
  function rewriteThemeCss(css) {
    return String(css || "")
      .replace(/(\d*\.?\d+)vh\b/g, "$1cqh")
      .replace(/(\d*\.?\d+)vw\b/g, "$1cqw");
  }
  const style = document.createElement("style");
  style.textContent = rewriteThemeCss(messageApi.STYLE) + "\n" + rewriteThemeCss(mosaicApi.STYLE);
  document.head.appendChild(style);
  if (messageApi.FONTS) {
    const fonts = document.createElement("link");
    fonts.rel = "stylesheet";
    fonts.href = messageApi.FONTS;
    document.head.appendChild(fonts);
  }

  const CUSTOM_FILES = [
    ["message-grunge-poster.json", "Grunge Poster"],
    ["mosaic-slant-rows.json", "Slant Rows"],
    ["message-xmas-bauble.json", "Christmas Bauble"],
    ["message-xmas-postcard.json", "Christmas Postcard"],
    ["message-xmas-mantel.json", "Christmas Mantel"],
    ["mosaic-xmas-wreath.json", "Christmas Wreath"],
    ["mosaic-xmas-tree.json", "Christmas Tree"],
    ["mosaic-xmas-snowfall.json", "Christmas Snowfall"],
  ];

  const FEATURED_IDS = new Set(["message-grunge-poster", "mosaic-slant-rows"]);
  function isChristmasItem(item) {
    return /xmas|christmas/i.test(String(item.id || "") + " " + String(item.label || ""));
  }

  const customPacks = [];
  const settled = await Promise.all(
    CUSTOM_FILES.map(([file]) =>
      fetch(file)
        .then((r) => {
          if (!r.ok) throw new Error(file);
          return r.json();
        })
        .then((raw) => ({ file, raw }))
        .catch(() => null)
    )
  );
  settled.forEach((item, i) => {
    if (!item) return;
    try {
      const pack = customApi.parsePack(item.raw);
      if (pack.css) pack.css = rewriteThemeCss(pack.css);
      customPacks.push({
        kind: pack.kind,
        id: pack.id,
        label: CUSTOM_FILES[i][1] || pack.label || pack.id,
        pack,
        custom: true,
      });
    } catch {
      /* skip bad pack */
    }
  });
  if (customApi && typeof customApi.whenReady === "function") {
    await customApi.whenReady();
  }
  // Register after bundled-pack bootstrap so loadAndRegister() cannot wipe pack CSS.
  function registerPreviewPacks() {
    if (!customPacks.length || !customApi.registerPacks) return;
    customApi.registerPacks(customPacks.map((item) => item.pack));
    if (rules.applyCustomThemeMeta) {
      rules.applyCustomThemeMeta(customPacks.map((item) => item.pack));
    }
  }
  registerPreviewPacks();
  if (customApi.onChange) {
    customApi.onChange(() => registerPreviewPacks());
  }

  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i += 1) {
      const ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i += 1;
          } else {
            inQuotes = false;
          }
        } else {
          field += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === ",") {
        row.push(field);
        field = "";
      } else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i += 1;
        row.push(field);
        field = "";
        if (row.some((cell) => cell)) rows.push(row);
        row = [];
      } else {
        field += ch;
      }
    }
    if (field || row.length) {
      row.push(field);
      if (row.some((cell) => cell)) rows.push(row);
    }
    return rows;
  }

  function shuffle(list) {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = out[i];
      out[i] = out[j];
      out[j] = tmp;
    }
    return out;
  }

  let captures = [];
  try {
    const text = await fetch(CSV_URL).then((r) => r.text());
    const rows = parseCsv(text);
    const header = rows.shift() || [];
    const fileIdx = header.indexOf("captures");
    const nameIdx = header.indexOf("name");
    const msgIdx = header.indexOf("message");
    captures = rows
      .map((row) => ({
        src: SAMPLE_DIR + (row[fileIdx] || "").trim(),
        name: (row[nameIdx] || "").trim(),
        message: (row[msgIdx] || "").trim(),
      }))
      .filter((row) => row.src && row.src !== SAMPLE_DIR);
  } catch {
    captures = [];
  }

  const photos = captures.map((row) => row.src).filter(Boolean);

  const catalog = [];
  Object.keys(rules.MESSAGE_THEME_META || {}).forEach((id) => {
    catalog.push({
      kind: "message",
      id,
      label: rules.MESSAGE_THEME_META[id].label || id,
      custom: false,
    });
  });
  Object.keys(rules.MOSAIC_THEME_META || {}).forEach((id) => {
    if (rules.MOSAIC_THEME_META[id] && rules.MOSAIC_THEME_META[id].hidden) return;
    catalog.push({
      kind: "mosaic",
      id,
      label: rules.MOSAIC_THEME_META[id].label || id,
      custom: false,
    });
  });
  customPacks.forEach((item) => {
    if (catalog.some((entry) => entry.id === item.id)) return;
    catalog.push(item);
  });

  const themeSelect = document.getElementById("theme-select");
  const aspectSelect = document.getElementById("aspect-select");
  const customAspect = document.getElementById("custom-aspect");
  const aspectW = document.getElementById("aspect-w");
  const aspectH = document.getElementById("aspect-h");
  const metaTitle = document.getElementById("meta-title");
  const metaSub = document.getElementById("meta-sub");
  const messageRoot = document.getElementById("dyn-message-theme");
  const mosaicRoot = document.getElementById("dyn-mosaic-theme");
  const settingsPanel = document.getElementById("settings-panel");
  const settingsFields = document.getElementById("settings-fields");
  const resetSettingsBtn = document.getElementById("reset-settings");

  const settingsByTheme = Object.create(null);
  const dockToggle = document.getElementById("dock-toggle");
  const dockChip = document.getElementById("dock-chip");
  const dockChipLabel = document.getElementById("dock-chip-label");
  let urlSyncTimer = 0;
  let urlSyncReady = false;

  function hexFromParam(value) {
    const raw = String(value || "").trim().replace(/^#/, "");
    if (/^[0-9a-fA-F]{6}$/.test(raw)) return "#" + raw.toLowerCase();
    if (/^[0-9a-fA-F]{3}$/.test(raw)) {
      return (
        "#" +
        (raw[0] + raw[0] + raw[1] + raw[1] + raw[2] + raw[2]).toLowerCase()
      );
    }
    return "";
  }

  function hexForUrl(value) {
    const hex = hexFromParam(value);
    return hex ? hex.slice(1) : "";
  }

  function setDockCollapsed(collapsed) {
    document.body.classList.toggle("dock-collapsed", Boolean(collapsed));
    if (dockToggle) dockToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    scheduleUrlSync();
  }

  function syncUrlFromState() {
    if (!urlSyncReady || !active) return;
    const p = new URLSearchParams();
    p.set("theme", active.id);
    if (stageMode === "custom") {
      p.set("aspect", "custom");
      p.set("aw", String(aspectW.value || "16"));
      p.set("ah", String(aspectH.value || "9"));
    } else {
      const aspect = resolvedAspect();
      if (aspect && aspect !== "vixi") p.set("aspect", aspect);
    }
    const settings = settingsFor(active.id, active.pack);
    const meta = settingsMetaFor(active.id);
    const defaults = (meta && meta.defaults) || {};
    ["primary", "secondary", "background"].forEach((key) => {
      if (!settings[key]) return;
      if (defaults[key] && hexFromParam(settings[key]) === hexFromParam(defaults[key])) return;
      const hex = hexForUrl(settings[key]);
      if (hex) p.set(key, hex);
    });
    if (settings.motion && settings.motion !== defaults.motion) p.set("motion", settings.motion);
    if (settings.scale != null && Math.abs(Number(settings.scale) - Number(defaults.scale || 1)) > 0.001) {
      p.set("scale", String(Math.round(Number(settings.scale) * 100) / 100));
    }
    if (previewBgFit && previewBgFit !== "cover") p.set("bgfit", previewBgFit);
    if (document.body.classList.contains("dock-collapsed")) p.set("dock", "min");
    const qs = p.toString();
    const next = location.pathname + (qs ? "?" + qs : "") + location.hash;
    const cur = location.pathname + location.search + location.hash;
    if (next !== cur) history.replaceState(null, "", next);
  }

  function scheduleUrlSync() {
    clearTimeout(urlSyncTimer);
    urlSyncTimer = setTimeout(syncUrlFromState, 100);
  }

  function applyUrlSettings(themeId, params) {
    if (!themeId || !params) return;
    const patch = {};
    const primary = hexFromParam(params.get("primary"));
    const secondary = hexFromParam(params.get("secondary"));
    const background = hexFromParam(params.get("background"));
    if (primary) patch.primary = primary;
    if (secondary) patch.secondary = secondary;
    if (background) patch.background = background;
    const motion = params.get("motion");
    if (motion) patch.motion = motion;
    const scaleRaw = params.get("scale");
    if (scaleRaw != null && scaleRaw !== "") {
      const scale = Number(scaleRaw);
      if (Number.isFinite(scale) && scale > 0) patch.scale = scale;
    }
    if (!Object.keys(patch).length) return;
    settingsByTheme[themeId] = { ...(settingsByTheme[themeId] || {}), ...patch };
  }

  function addGroup(select, label, items) {
    if (!items.length) return;
    const group = document.createElement("optgroup");
    group.label = label;
    items
      .slice()
      .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: "base" }))
      .forEach((item) => {
        const opt = document.createElement("option");
        opt.value = item.kind + ":" + item.id;
        opt.textContent = item.label;
        group.appendChild(opt);
      });
    select.appendChild(group);
  }

  addGroup(
    themeSelect,
    "Message · built-in",
    catalog.filter(
      (item) =>
        item.kind === "message" &&
        (!item.custom || FEATURED_IDS.has(item.id))
    )
  );
  addGroup(
    themeSelect,
    "Mosaic · built-in",
    catalog.filter(
      (item) =>
        item.kind === "mosaic" &&
        (!item.custom || FEATURED_IDS.has(item.id))
    )
  );
  addGroup(
    themeSelect,
    "Christmas",
    catalog.filter((item) => item.custom && isChristmasItem(item))
  );

  (rules.STAGE_ASPECT_PRESETS || []).forEach((preset) => {
    const opt = document.createElement("option");
    opt.value = preset.value;
    opt.textContent = preset.label;
    aspectSelect.appendChild(opt);
  });
  const customOpt = document.createElement("option");
  customOpt.value = "custom";
  customOpt.textContent = "Custom — set width : height";
  aspectSelect.appendChild(customOpt);

  let stageMode = "vixi";
  let active = null;
  let messageState = null;
  let mosaicState = null;
  let messageTimer = 0;
  let mosaicTimer = 0;
  let captureIndex = 0;
  let messageCycle = 0;
  let resizeRo = null;

  function decodeImage(src) {
    if (!src) return Promise.resolve();
    return new Promise((resolve) => {
      const img = new Image();
      let settled = false;
      const done = () => {
        if (settled) return;
        settled = true;
        resolve();
      };
      img.onload = () => {
        if (typeof img.decode === "function") {
          img.decode().then(done).catch(done);
        } else {
          done();
        }
      };
      img.onerror = done;
      img.src = src;
      setTimeout(done, 1100);
    });
  }

  /** Match extension/message.js present(): visible exit, hidden swap, animated enter. */
  async function presentMessage(capture, def, state, settings) {
    if (!capture || !def || !messageState) return;
    const token = ++messageCycle;
    const shouldHide = messageRoot.classList.contains("on");
    messageRoot.classList.remove("dyn-awaiting-show");
    try {
      await decodeImage(capture.src);
      if (token !== messageCycle) return;
      if (shouldHide && typeof def.hide === "function") {
        await def.hide(messageRoot, state);
      }
      if (token !== messageCycle) return;
      if (shouldHide) messageRoot.classList.add("dyn-awaiting-show");
      const img =
        (messageApi.findMessagePhoto && messageApi.findMessagePhoto(messageRoot)) ||
        messageRoot.querySelector(".well img, [data-photo]");
      if (
        img &&
        capture.src &&
        !(messageApi.isBackgroundMediaNode && messageApi.isBackgroundMediaNode(img))
      ) {
        img.src = capture.src;
      }
      messageRoot.classList.remove("dyn-awaiting-show");
      const live = messageState.settings || settings;
      await def.show(messageRoot, capture, state, live);
      if (token !== messageCycle) return;
      if (messageApi.ensureFitStage) messageApi.ensureFitStage(messageRoot);
    } finally {
      if (token === messageCycle) {
        messageRoot.classList.remove("dyn-awaiting-show");
      }
    }
  }

  function clearTimers() {
    messageCycle += 1;
    if (messageTimer) {
      clearInterval(messageTimer);
      messageTimer = 0;
    }
    if (mosaicTimer) {
      clearInterval(mosaicTimer);
      mosaicTimer = 0;
    }
    if (resizeRo) {
      resizeRo.disconnect();
      resizeRo = null;
    }
  }

  function resetThemeRoot(root) {
    if (!root) return;
    const keep = [];
    if (root.classList.contains("dyn-stage-letterbox")) keep.push("dyn-stage-letterbox");
    if (root.classList.contains("dyn-portrait")) keep.push("dyn-portrait");
    root.className = keep.join(" ");
    root.removeAttribute("data-theme");
    root.removeAttribute("data-engine");
    root.removeAttribute("data-aspect");
    root.replaceChildren();
  }

  function parkPreviewBgHost() {
    const host = document.getElementById("preview-bg");
    const stage = document.getElementById("stage");
    if (host && stage && host.parentElement !== stage) {
      stage.insertBefore(host, stage.firstChild);
    }
  }

  function unmountCurrent() {
    clearTimers();
    parkPreviewBgHost();
    if (mosaicState && mosaicApi.themes[mosaicState.id] && mosaicApi.themes[mosaicState.id].unmount) {
      try {
        mosaicApi.themes[mosaicState.id].unmount(mosaicRoot, mosaicState.state);
      } catch {
        /* already gone */
      }
    }
    if (messageState && messageApi.themes[messageState.id] && messageApi.themes[messageState.id].unmount) {
      try {
        messageApi.themes[messageState.id].unmount(messageRoot, messageState.state);
      } catch {
        /* already gone */
      }
    }
    resetThemeRoot(mosaicRoot);
    resetThemeRoot(messageRoot);
    mosaicState = null;
    messageState = null;
  }

  function settingsMetaFor(id) {
    const messageAll = rules.messageThemeMetaAll ? rules.messageThemeMetaAll() : rules.MESSAGE_THEME_META || {};
    const mosaicAll = rules.mosaicThemeMetaAll ? rules.mosaicThemeMetaAll() : rules.MOSAIC_THEME_META || {};
    if (messageAll[id] && messageAll[id].defaults) return messageAll[id];
    if (mosaicAll[id] && mosaicAll[id].defaults) return mosaicAll[id];
    const baseId = rules.mosaicSettingsBaseId ? rules.mosaicSettingsBaseId(id) : id;
    return mosaicAll[baseId] || messageAll[id] || mosaicAll[id] || null;
  }

  function settingsStoreId(id) {
    const meta = settingsMetaFor(id);
    if (meta && meta.defaults && (meta.custom || (rules.messageThemeMetaAll && rules.messageThemeMetaAll()[id]))) {
      return id;
    }
    return (rules.mosaicSettingsBaseId && rules.mosaicSettingsBaseId(id)) || id;
  }

  function settingsFor(id, pack) {
    const storeId = settingsStoreId(id);
    const meta = settingsMetaFor(id);
    if (meta && rules.normalizeOneThemeSettings) {
      const stored = settingsByTheme[id] || settingsByTheme[storeId] || {};
      const normalized = rules.normalizeOneThemeSettings(storeId, stored);
      return {
        ...normalized,
        revealMs:
          Number(normalized.revealMs) ||
          Number(meta.defaults && meta.defaults.revealMs) ||
          (pack && pack.revealMs) ||
          1000,
      };
    }
    if (pack && pack.settings) {
      const out = { revealMs: pack.revealMs || 1000 };
      Object.keys(pack.settings).forEach((key) => {
        out[key] = pack.settings[key].default;
      });
      return { ...out, ...(settingsByTheme[id] || {}) };
    }
    const defaults = (meta && meta.defaults) || {};
    return {
      primary: defaults.primary || "#d52265",
      secondary: defaults.secondary || "#fec651",
      background: defaults.background,
      motion: defaults.motion,
      scale: defaults.scale,
      revealMs: defaults.revealMs || 1000,
      ...(settingsByTheme[id] || {}),
    };
  }

  const mediaApi = globalThis.BGMediaStore;
  const WALLPAPER_PREFIX = "preview-wallpaper:";
  const PREVIEW_BG_ID = "preview-stage-bg";
  let previewBgMediaId = "";
  let previewBgFit = "cover";

  function wallpaperIdFor(themeId) {
    return WALLPAPER_PREFIX + String(themeId || "");
  }

  function setMediaStatus(el, message, tone) {
    if (!el) return;
    el.textContent = message || "";
    el.classList.remove("is-ok", "is-error");
    if (tone) el.classList.add(tone);
  }

  async function refreshMediaName(nameEl, mediaId) {
    if (!nameEl) return;
    if (!mediaId || !mediaApi) {
      nameEl.textContent = "No file";
      return;
    }
    const asset = await mediaApi.getMedia(mediaId);
    nameEl.textContent = asset && asset.name ? asset.name : "No file";
  }

  function mediaRow(themeId, label, mediaId) {
    const wrap = document.createElement("div");
    wrap.className = "setting-row media";
    wrap.dataset.setting = "wallpaper";
    wrap.innerHTML =
      '<div class="media-head">' +
      `<span>${label || "Chat wallpaper"}</span>` +
      '<span class="media-file-name">No file</span>' +
      "</div>" +
      '<div class="media-actions">' +
      '<label class="dock-btn">Choose file…<input type="file" accept="image/*,video/*,.gif" hidden></label>' +
      '<button type="button" class="dock-btn dock-btn-ghost media-clear">Clear</button>' +
      "</div>" +
      '<p class="media-status" role="status"></p>' +
      `<input type="hidden" class="theme-wallpaper" value="${mediaId || ""}">`;
    const nameEl = wrap.querySelector(".media-file-name");
    const status = wrap.querySelector(".media-status");
    const hidden = wrap.querySelector(".theme-wallpaper");
    const input = wrap.querySelector('input[type="file"]');
    const clearBtn = wrap.querySelector(".media-clear");
    refreshMediaName(nameEl, mediaId);
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      input.value = "";
      if (!file) return;
      if (!mediaApi) {
        setMediaStatus(status, "Media uploads unavailable.", "is-error");
        return;
      }
      try {
        setMediaStatus(status, "Importing…");
        const asset = await mediaApi.ingestFile(file);
        const id = wallpaperIdFor(themeId);
        const ok = await mediaApi.putMedia(id, asset);
        if (!ok) throw new Error("Could not save that file.");
        hidden.value = id;
        await refreshMediaName(nameEl, id);
        setMediaStatus(status, "Saved.", "is-ok");
        settingsByTheme[themeId] = readSettingsForm(themeId);
        applyLiveSettings();
      } catch (err) {
        setMediaStatus(status, err && err.message ? err.message : "Import failed.", "is-error");
      }
    });
    clearBtn.addEventListener("click", async () => {
      const id = hidden.value || wallpaperIdFor(themeId);
      if (mediaApi && id) await mediaApi.removeMedia(id);
      hidden.value = "";
      nameEl.textContent = "No file";
      setMediaStatus(status, "Cleared.");
      settingsByTheme[themeId] = readSettingsForm(themeId);
      applyLiveSettings();
    });
    return wrap;
  }

  function colorRow(key, label, value) {
    const row = document.createElement("label");
    row.className = "setting-row";
    row.innerHTML =
      `<span>${label}</span>` +
      `<input type="text" class="theme-hex" data-key="${key}" maxlength="7" spellcheck="false" value="${value}">` +
      `<input type="color" class="theme-color" data-key="${key}" value="${value}">`;
    return row;
  }

  function motionRow(value) {
    const row = document.createElement("label");
    row.className = "setting-row select";
    row.innerHTML =
      `<span>Motion</span>` +
      `<select class="theme-motion" data-key="motion">` +
        `<option value="slow">Slow — wander</option>` +
        `<option value="drift">Drift — across the field</option>` +
        `<option value="fizz">Fizz — rise from below</option>` +
      `</select>`;
    row.querySelector("select").value = value || "drift";
    return row;
  }

  function scaleRow(label, value) {
    const pct = Math.round((Number(value) || 1) * 100);
    const row = document.createElement("label");
    row.className = "setting-row scale";
    row.innerHTML =
      `<span>${label}</span>` +
      `<input type="range" class="theme-scale" min="70" max="150" step="1" value="${pct}">` +
      `<span class="theme-scale-value">${pct}%</span>`;
    return row;
  }

  function selectRow(key, label, value, options) {
    const row = document.createElement("label");
    row.className = "setting-row select";
    const opts = (options || [])
      .map(
        (option) =>
          `<option value="${option.value}">${option.label || option.value}</option>`
      )
      .join("");
    row.innerHTML =
      `<span>${label}</span>` +
      `<select class="theme-select" data-key="${key}">${opts}</select>`;
    const select = row.querySelector("select");
    if (select) select.value = value || (options[0] && options[0].value) || "";
    return row;
  }

  function toggleRow(key, label, value) {
    const row = document.createElement("label");
    row.className = "setting-row toggle";
    row.innerHTML =
      `<span>${label}</span>` +
      `<input type="checkbox" class="theme-toggle" data-key="${key}"${value ? " checked" : ""}>`;
    return row;
  }

  function appendExtraThemeSettings(container, meta, values) {
    const skip = new Set(["primary", "secondary", "background", "scale", "motion", "wallpaper", "revealMs"]);
    const labels = (meta && meta.labels) || {};
    const defaults = (meta && meta.defaults) || {};
    const selects = (meta && meta.selects) || {};
    Object.keys(defaults).forEach((key) => {
      if (skip.has(key)) return;
      if (selects[key] && selects[key].length) {
        container.appendChild(
          selectRow(key, labels[key] || key, values[key] || defaults[key], selects[key])
        );
      } else if (typeof defaults[key] === "boolean") {
        container.appendChild(toggleRow(key, labels[key] || key, Boolean(values[key])));
      } else if (/^#[0-9a-fA-F]{6}$/.test(defaults[key])) {
        container.appendChild(colorRow(key, labels[key] || key, values[key] || defaults[key]));
      }
    });
  }

  function readSettingsForm(id) {
    const raw = {};
    settingsFields.querySelectorAll(".theme-hex").forEach((input) => {
      raw[input.dataset.key] = input.value;
    });
    settingsFields.querySelectorAll(".theme-toggle").forEach((input) => {
      raw[input.dataset.key] = input.checked;
    });
    settingsFields.querySelectorAll(".theme-select").forEach((input) => {
      raw[input.dataset.key] = input.value;
    });
    const motion = settingsFields.querySelector(".theme-motion");
    if (motion) raw.motion = motion.value;
    const scale = settingsFields.querySelector(".theme-scale");
    if (scale) raw.scale = Number(scale.value) / 100;
    const wallpaper = settingsFields.querySelector(".theme-wallpaper");
    if (wallpaper) raw.wallpaper = wallpaper.value;
    const storeId = settingsStoreId(id);
    if (rules.normalizeOneThemeSettings) return rules.normalizeOneThemeSettings(storeId, raw);
    return raw;
  }

  function applyLiveSettings() {
    if (!active) return;
    const settings = settingsFor(active.id, active.pack);
    if (active.kind === "message" && messageState) {
      const def = messageApi.themes[active.id];
      if (!def) return;
      const prev = messageState.settings || {};
      messageState.settings = settings;
      // Match extension/message.js: live color tweaks use applySettings only.
      if (def.applySettings) def.applySettings(messageRoot, messageState.state, settings);
      const photoChanged =
        (prev.photoStyle || "bw") !== (settings.photoStyle || "bw");
      if (photoChanged && def.show) {
        void def.show(messageRoot, captureAt(captureIndex), messageState.state, settings);
      }
      scheduleUrlSync();
      return;
    }
    if (active.kind === "mosaic" && mosaicState) {
      const def = mosaicApi.themes[active.id];
      if (!def) return;
      const prev = mosaicState.settings || {};
      mosaicState.settings = settings;
      if (Math.abs((prev.scale || 1) - (settings.scale || 1)) > 0.001) {
        mountEntry(active, { keepSettingsForm: true });
        return;
      }
      if (def.applySettings) def.applySettings(mosaicRoot, mosaicState.state, settings);
      scheduleUrlSync();
    }
  }

  function renderSettingsPanel(entry) {
    settingsFields.replaceChildren();
    if (!entry) {
      settingsPanel.hidden = true;
      settingsPanel.classList.remove("is-open");
      return;
    }
    const meta = settingsMetaFor(entry.id);
    const hasMosaic =
      meta &&
      meta.defaults &&
      (meta.defaults.scale != null ||
        meta.defaults.primary ||
        meta.defaults.secondary ||
        meta.defaults.background ||
        meta.defaults.frame ||
        meta.defaults.photoStyle);
    const hasMessage = Boolean(meta && meta.defaults && entry.kind === "message");
    if (entry.kind === "message" && !hasMessage) {
      settingsPanel.hidden = true;
      settingsPanel.classList.remove("is-open");
      return;
    }
    if (entry.kind === "mosaic" && !hasMosaic) {
      settingsPanel.hidden = true;
      settingsPanel.classList.remove("is-open");
      return;
    }
    if (!meta) {
      settingsPanel.hidden = true;
      settingsPanel.classList.remove("is-open");
      return;
    }
    const values = settingsFor(entry.id, entry.pack);
    const labels = meta.labels || {};
    if (meta.defaults.scale != null) {
      settingsFields.appendChild(scaleRow(labels.scale || "Photo size", values.scale));
    }
    if (meta.defaults.primary) {
      settingsFields.appendChild(colorRow("primary", labels.primary || "Primary", values.primary));
    }
    if (meta.defaults.secondary) {
      settingsFields.appendChild(colorRow("secondary", labels.secondary || "Secondary", values.secondary));
    }
    if (meta.defaults.background) {
      settingsFields.appendChild(
        colorRow("background", labels.background || "Background", values.background)
      );
    }
    if (meta.defaults.motion) {
      settingsFields.appendChild(motionRow(values.motion));
    }
    if (Object.prototype.hasOwnProperty.call(meta.defaults, "wallpaper")) {
      settingsFields.appendChild(
        mediaRow(entry.id, labels.wallpaper || "Chat wallpaper", values.wallpaper || "")
      );
    }
    appendExtraThemeSettings(settingsFields, meta, values);

    settingsFields.querySelectorAll(".theme-color").forEach((colorInput) => {
      const key = colorInput.dataset.key;
      const hexInput = settingsFields.querySelector(`.theme-hex[data-key="${key}"]`);
      colorInput.addEventListener("input", () => {
        if (hexInput) hexInput.value = colorInput.value;
        settingsByTheme[entry.id] = readSettingsForm(entry.id);
        applyLiveSettings();
      });
    });
    settingsFields.querySelectorAll(".theme-hex").forEach((hexInput) => {
      const key = hexInput.dataset.key;
      const colorInput = settingsFields.querySelector(`.theme-color[data-key="${key}"]`);
      hexInput.addEventListener("input", () => {
        const v = hexInput.value.trim();
        if (/^#[0-9a-fA-F]{6}$/.test(v) && colorInput) colorInput.value = v.toLowerCase();
        if (/^#[0-9a-fA-F]{6}$/.test(v)) {
          settingsByTheme[entry.id] = readSettingsForm(entry.id);
          applyLiveSettings();
        }
      });
    });
    settingsFields.querySelectorAll(".theme-scale").forEach((input) => {
      const valueEl = settingsFields.querySelector(".theme-scale-value");
      input.addEventListener("input", () => {
        if (valueEl) valueEl.textContent = input.value + "%";
        settingsByTheme[entry.id] = readSettingsForm(entry.id);
        applyLiveSettings();
      });
    });
    settingsFields.querySelectorAll(".theme-motion").forEach((input) => {
      input.addEventListener("change", () => {
        settingsByTheme[entry.id] = readSettingsForm(entry.id);
        mountEntry(entry, { keepSettingsForm: true });
      });
    });
    settingsFields.querySelectorAll(".theme-select").forEach((input) => {
      input.addEventListener("change", () => {
        settingsByTheme[entry.id] = readSettingsForm(entry.id);
        applyLiveSettings();
      });
    });
    settingsFields.querySelectorAll(".theme-toggle").forEach((input) => {
      input.addEventListener("change", () => {
        settingsByTheme[entry.id] = readSettingsForm(entry.id);
        applyLiveSettings();
      });
    });

    settingsPanel.hidden = false;
    settingsPanel.classList.add("is-open");
  }

  function captureAt(index) {
    if (!captures.length) {
      return {
        src: "",
        name: "Sam & Jo",
        message: "Wish you were here — the lights went on and the whole room went quiet.",
      };
    }
    return captures[((index % captures.length) + captures.length) % captures.length];
  }

  function resolvedAspect() {
    if (stageMode === "custom") {
      return rules.normalizeStageAspect(aspectW.value + ":" + aspectH.value);
    }
    return stageMode;
  }

  function applyAspect() {
    const mode = resolvedAspect();
    if (rules.setStageAspect) rules.setStageAspect(mode);
    const activeRoot = document.body.classList.contains("is-mosaic") ? mosaicRoot : messageRoot;
    if (rules.applyStageFrame) {
      rules.applyStageFrame(mosaicRoot, mode);
      rules.applyStageFrame(messageRoot, mode);
      // Keep the inactive root from also letterboxing as a second box.
      if (activeRoot === mosaicRoot) messageRoot.classList.remove("dyn-stage-letterbox");
      else mosaicRoot.classList.remove("dyn-stage-letterbox");
    }
  }

  function updateMeta(entry) {
    metaTitle.textContent = entry.label;
    if (dockChipLabel) dockChipLabel.textContent = entry.label;
    const kind = entry.kind === "mosaic" ? "Mosaic" : "Message";
    const source = entry.custom ? "example pack" : "built-in";
    const photoNote = photos.length
      ? photos.length + " sample photos (same as homepage)"
      : "no sample photos loaded";
    metaSub.innerHTML =
      kind +
      " · " +
      source +
      " · " +
      photoNote +
      ' · <a href="../index.html">Back to gallery</a>';
  }

  function mountEntry(entry, opts) {
    unmountCurrent();
    active = entry;
    updateMeta(entry);
    themeSelect.value = entry.kind + ":" + entry.id;
    document.body.classList.toggle("is-mosaic", entry.kind === "mosaic");
    document.documentElement.classList.toggle("dyn-theme-on", true);
    document.documentElement.classList.toggle("dyn-message-on", entry.kind === "message");
    document.documentElement.classList.toggle("dyn-kind-message", entry.kind === "message");
    applyAspect();
    if (!(opts && opts.keepSettingsForm)) renderSettingsPanel(entry);

    if (entry.kind === "mosaic") {
      const def = mosaicApi.themes[entry.id];
      mosaicRoot.dataset.theme = entry.id;
      const engine =
        (def && def.engine) ||
        (entry.pack && entry.pack.engine) ||
        (String(entry.id).endsWith("-brand") ? entry.id.replace(/-brand$/, "") : "");
      if (engine) mosaicRoot.dataset.engine = engine;
      else mosaicRoot.removeAttribute("data-engine");
      if (!def) {
        metaSub.textContent = "Theme engine not found.";
        scheduleUrlSync();
        void renderPreviewBackground();
        return;
      }
      const pool = photos.length ? shuffle(photos) : [];
      const api = {
        nextUrl() {
          return pool[Math.floor(Math.random() * pool.length)] || "";
        },
        isRetiring() {
          return false;
        },
        hasIncoming() {
          return false;
        },
      };
      const settings = settingsFor(entry.id, entry.pack);
      const state = def.mount(mosaicRoot, pool, api, settings) || {};
      if (def.applySettings) def.applySettings(mosaicRoot, state, settings);
      mosaicState = { id: entry.id, state, settings };
      if (def.tick) {
        mosaicTimer = setInterval(() => {
          def.tick(mosaicRoot, pool, state, api);
        }, def.interval || (entry.pack && entry.pack.interval) || 2400);
      }
      scheduleUrlSync();
      void renderPreviewBackground();
      return;
    }

    const def = messageApi.themes[entry.id];
    messageRoot.dataset.theme = entry.id;
    const engine = (def && def.engine) || (entry.pack && entry.pack.engine) || "";
    if (engine) messageRoot.dataset.engine = engine;
    else messageRoot.removeAttribute("data-engine");
    if (!def) {
      metaSub.textContent = "Theme engine not found.";
      scheduleUrlSync();
      void renderPreviewBackground();
      return;
    }
    const settings = settingsFor(entry.id, entry.pack);
    const state = def.mount(messageRoot, settings);
    messageState = { id: entry.id, state, settings };
    if (def.applySettings) def.applySettings(messageRoot, state, settings);
    void presentMessage(captureAt(captureIndex), def, state, settings);
    if (typeof ResizeObserver !== "undefined" && messageApi.ensureFitStage) {
      resizeRo = new ResizeObserver(() => messageApi.ensureFitStage(messageRoot));
      resizeRo.observe(messageRoot);
    }
    messageTimer = setInterval(() => {
      captureIndex += 1;
      void presentMessage(captureAt(captureIndex), def, state, settings);
    }, MESSAGE_CYCLE_MS);
    scheduleUrlSync();
    void renderPreviewBackground();
  }

  function findEntry(value) {
    const [kind, id] = String(value || "").split(":");
    return catalog.find((item) => item.kind === kind && item.id === id) || catalog[0];
  }

  function syncCustomAspectUI() {
    const isCustom = aspectSelect.value === "custom";
    customAspect.classList.toggle("is-open", isCustom);
  }

  function setAspectFromUI() {
    if (aspectSelect.value === "custom") {
      stageMode = "custom";
    } else {
      stageMode = aspectSelect.value;
      const parsed = rules.parseStageAspect && rules.parseStageAspect(stageMode);
      if (parsed && parsed.mode !== "auto" && parsed.mode !== "vixi" && parsed.aw) {
        aspectW.value = parsed.aw;
        aspectH.value = parsed.ah;
      }
    }
    syncCustomAspectUI();
    if (active) mountEntry(active);
    else applyAspect();
    scheduleUrlSync();
  }

  themeSelect.addEventListener("change", () => {
    const entry = findEntry(themeSelect.value);
    if (entry) mountEntry(entry);
  });
  aspectSelect.addEventListener("change", setAspectFromUI);
  aspectW.addEventListener("change", () => {
    if (aspectSelect.value !== "custom") aspectSelect.value = "custom";
    stageMode = "custom";
    syncCustomAspectUI();
    if (active) mountEntry(active);
    scheduleUrlSync();
  });
  aspectH.addEventListener("change", () => {
    if (aspectSelect.value !== "custom") aspectSelect.value = "custom";
    stageMode = "custom";
    syncCustomAspectUI();
    if (active) mountEntry(active);
    scheduleUrlSync();
  });

  document.getElementById("prev-theme").addEventListener("click", () => {
    const opts = [...themeSelect.options];
    const i = opts.findIndex((opt) => opt.value === themeSelect.value);
    const next = opts[(i - 1 + opts.length) % opts.length];
    themeSelect.value = next.value;
    mountEntry(findEntry(next.value));
  });
  document.getElementById("next-theme").addEventListener("click", () => {
    const opts = [...themeSelect.options];
    const i = opts.findIndex((opt) => opt.value === themeSelect.value);
    const next = opts[(i + 1) % opts.length];
    themeSelect.value = next.value;
    mountEntry(findEntry(next.value));
  });
  if (resetSettingsBtn) {
    resetSettingsBtn.addEventListener("click", async () => {
      if (!active) return;
      const prev = settingsByTheme[active.id] || {};
      if (prev.wallpaper && mediaApi) await mediaApi.removeMedia(prev.wallpaper);
      delete settingsByTheme[active.id];
      const storeId = settingsStoreId(active.id);
      if (storeId !== active.id) delete settingsByTheme[storeId];
      renderSettingsPanel(active);
      mountEntry(active, { keepSettingsForm: true });
      scheduleUrlSync();
    });
  }

  const previewBgHost = document.getElementById("preview-bg");
  const previewBgFile = document.getElementById("preview-bg-file");
  const previewBgClear = document.getElementById("preview-bg-clear");
  const previewBgName = document.getElementById("preview-bg-name");
  const previewBgStatus = document.getElementById("preview-bg-status");
  const previewBgFitSelect = document.getElementById("preview-bg-fit");

  function applyPreviewBgFit(node) {
    if (!node || !mediaApi) return;
    const css = mediaApi.fitCss(previewBgFit);
    node.style.objectFit = css.objectFit;
    node.style.objectPosition = css.objectPosition;
  }

  async function renderPreviewBackground() {
    if (!previewBgHost) return;
    const stage = document.getElementById("stage");
    const activeTheme = document.body.classList.contains("is-mosaic")
      ? document.getElementById("dyn-mosaic-theme")
      : document.getElementById("dyn-message-theme");

    function parkPreviewBg() {
      if (stage && previewBgHost.parentElement !== stage) {
        stage.insertBefore(previewBgHost, stage.firstChild);
      }
    }

    if (!previewBgMediaId || !mediaApi) {
      previewBgHost.replaceChildren();
      document.body.classList.remove("has-preview-bg");
      parkPreviewBg();
      return;
    }
    const asset = await mediaApi.getMedia(previewBgMediaId);
    if (!asset || !asset.dataUrl) {
      previewBgHost.replaceChildren();
      document.body.classList.remove("has-preview-bg");
      parkPreviewBg();
      return;
    }

    if (activeTheme && previewBgHost.parentElement !== activeTheme) {
      activeTheme.insertBefore(previewBgHost, activeTheme.firstChild);
    }

    const wantVideo = mediaApi.isVideoMime && mediaApi.isVideoMime(asset.mime);
    let node = previewBgHost.firstElementChild;
    const tag = wantVideo ? "VIDEO" : "IMG";
    if (!node || node.tagName !== tag) {
      previewBgHost.replaceChildren();
      node = document.createElement(wantVideo ? "video" : "img");
      if (wantVideo) {
        node.autoplay = true;
        node.loop = true;
        node.muted = true;
        node.playsInline = true;
        node.setAttribute("playsinline", "");
      }
      node.alt = "";
      previewBgHost.appendChild(node);
    }
    if (node.getAttribute("src") !== asset.dataUrl) node.src = asset.dataUrl;
    applyPreviewBgFit(node);
    document.body.classList.add("has-preview-bg");
    if (wantVideo && typeof node.play === "function") {
      const play = node.play();
      if (play && typeof play.catch === "function") play.catch(() => {});
    }
  }

  if (previewBgFitSelect) {
    previewBgFitSelect.value = previewBgFit;
    previewBgFitSelect.addEventListener("change", () => {
      previewBgFit = mediaApi && mediaApi.normalizeFit
        ? mediaApi.normalizeFit(previewBgFitSelect.value)
        : previewBgFitSelect.value || "cover";
      const node = previewBgHost && previewBgHost.firstElementChild;
      if (node) applyPreviewBgFit(node);
      scheduleUrlSync();
    });
  }

  if (previewBgFile) {
    previewBgFile.addEventListener("change", async () => {
      const file = previewBgFile.files && previewBgFile.files[0];
      previewBgFile.value = "";
      if (!file) return;
      if (!mediaApi) {
        setMediaStatus(previewBgStatus, "Media uploads unavailable.", "is-error");
        return;
      }
      try {
        setMediaStatus(previewBgStatus, "Importing…");
        const asset = await mediaApi.ingestFile(file);
        const ok = await mediaApi.putMedia(PREVIEW_BG_ID, asset);
        if (!ok) throw new Error("Could not save that file.");
        previewBgMediaId = PREVIEW_BG_ID;
        await refreshMediaName(previewBgName, previewBgMediaId);
        setMediaStatus(previewBgStatus, "Saved.", "is-ok");
        await renderPreviewBackground();
      } catch (err) {
        setMediaStatus(
          previewBgStatus,
          err && err.message ? err.message : "Import failed.",
          "is-error"
        );
      }
    });
  }

  if (previewBgClear) {
    previewBgClear.addEventListener("click", async () => {
      if (mediaApi) await mediaApi.removeMedia(PREVIEW_BG_ID);
      previewBgMediaId = "";
      if (previewBgName) previewBgName.textContent = "No file";
      setMediaStatus(previewBgStatus, "Cleared.");
      await renderPreviewBackground();
    });
  }

  let previewResizeTimer = 0;
  window.addEventListener("resize", () => {
    applyAspect();
    if (stageMode !== "auto" || !active) return;
    clearTimeout(previewResizeTimer);
    previewResizeTimer = setTimeout(() => {
      previewResizeTimer = 0;
      if (active) mountEntry(active, { keepSettingsForm: true });
    }, 120);
  });

  if (dockToggle) {
    dockToggle.addEventListener("click", () => setDockCollapsed(true));
  }
  if (dockChip) {
    dockChip.addEventListener("click", () => setDockCollapsed(false));
  }

  const params = new URLSearchParams(location.search);
  const wantRaw = params.get("theme");
  const want =
    wantRaw && rules.MOSAIC_THEME_META && rules.MOSAIC_THEME_META[wantRaw] && rules.MOSAIC_THEME_META[wantRaw].hidden
      ? (typeof rules.normalizeMosaicTheme === "function" ? rules.normalizeMosaicTheme(wantRaw) : wantRaw)
      : wantRaw;
  const wantAspect = params.get("aspect");
  const awParam = params.get("aw");
  const ahParam = params.get("ah");
  if (awParam) aspectW.value = awParam;
  if (ahParam) aspectH.value = ahParam;
  if (wantAspect === "custom" || (awParam && ahParam && (!wantAspect || wantAspect === "custom"))) {
    aspectSelect.value = "custom";
  } else if (wantAspect && (rules.STAGE_ASPECTS || []).includes(wantAspect)) {
    aspectSelect.value = wantAspect;
  } else {
    aspectSelect.value = "vixi";
  }
  stageMode = aspectSelect.value;
  syncCustomAspectUI();

  const bgFitParam = params.get("bgfit");
  if (bgFitParam && mediaApi && mediaApi.normalizeFit) {
    previewBgFit = mediaApi.normalizeFit(bgFitParam);
  } else if (bgFitParam) {
    previewBgFit = bgFitParam;
  }
  if (previewBgFitSelect) previewBgFitSelect.value = previewBgFit;

  if (params.get("dock") === "min") setDockCollapsed(true);

  let start =
    (want && catalog.find((item) => item.id === want)) ||
    catalog.find((item) => item.id === "led-scoreboard") ||
    catalog[0];
  if (start) applyUrlSettings(start.id, params);
  urlSyncReady = true;
  if (start) mountEntry(start);
  else metaSub.textContent = "No themes available.";
})();
</script>
</body>
</html>
