<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="embed.js"></script>
    <title>Aurora</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #home {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.6px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(8, 8, 16, 0.5);
            backdrop-filter: blur(12px);
            transition: color 0.2s ease, border-color 0.2s ease;
            z-index: 4;
        }
        #home:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        #menu {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 268px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 14px 14px 12px;
            color: #e8e8f0;
            background: rgba(8, 8, 16, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 3;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #menu header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #menu header span {
            font-size: 11px;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        kbd {
            font-size: 9px;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }
        .section {
            margin-bottom: 12px;
        }
        .section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 7px;
        }
        .bg-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .color-field span {
            font-size: 8px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.38);
        }
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 72px 1fr 36px;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label {
            font-size: 10px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
        }
        .slider-row output {
            font-size: 10px;
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #reset,
        #copy-iframe {
            width: 100%;
            margin-top: 4px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.65);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 6px 0;
            cursor: pointer;
        }
        #reset:hover,
        #copy-iframe:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        html.preview #home,
        html.preview #menu,
        html.preview #loading,
        html.embed #home,
        html.embed #menu,
        html.embed #loading {
            display: none !important;
        }
    </style>
</head>
<body>
    <a id="home" href="../index.html">&#9666; GALLERY</a>
    <aside id="menu">
        <header>
            <span>SETTINGS</span>
            <kbd>SPACE</kbd>
        </header>

        <div class="section">
            <span class="section-label">COLORS</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="color-a" value="#3cffa8">
                    <span>AURORA A</span>
                </label>
                <label class="color-field">
                    <input type="color" id="color-b" value="#7a5cff">
                    <span>AURORA B</span>
                </label>
                <label class="color-field">
                    <input type="color" id="sky-color" value="#040a1c">
                    <span>SKY</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">MOTION</span>
            <div class="slider-row">
                <label for="speed">Wave speed</label>
                <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
                <output id="speed-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="intensity">Intensity</label>
                <input type="range" id="intensity" min="0" max="2" step="0.05" value="1">
                <output id="intensity-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="bands">Bands</label>
                <input type="range" id="bands" min="1" max="4" step="1" value="3">
                <output id="bands-out">3</output>
            </div>
        </div>

        <button type="button" id="reset">RESET</button>
        <button type="button" id="copy-iframe">COPY IFRAME</button>
    </aside>
    <canvas id="scene"></canvas>

    <script type="module">
        const STORAGE_KEY = 'bg-aurora-v1';
        const HEX = /^#[0-9a-fA-F]{6}$/;

        const DEFAULTS = {
            colorA: '#3cffa8',
            colorB: '#7a5cff',
            skyColor: '#040a1c',
            speed: 1,
            intensity: 1,
            bands: 3
        };

        function clamp(value, min, max, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        }

        function loadSettings() {
            try {
                const data = window.BGEmbed ? BGEmbed.rawData(STORAGE_KEY) : JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!data || typeof data !== 'object') return { ...DEFAULTS };

                return {
                    colorA: HEX.test(data.colorA) ? data.colorA : DEFAULTS.colorA,
                    colorB: HEX.test(data.colorB) ? data.colorB : DEFAULTS.colorB,
                    skyColor: HEX.test(data.skyColor) ? data.skyColor : DEFAULTS.skyColor,
                    speed: clamp(data.speed, 0, 3, DEFAULTS.speed),
                    intensity: clamp(data.intensity, 0, 2, DEFAULTS.intensity),
                    bands: Math.round(clamp(data.bands, 1, 4, DEFAULTS.bands))
                };
            } catch {
                return { ...DEFAULTS };
            }
        }

        const settings = loadSettings();

        const canvas = document.getElementById('scene');
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

        const vertexSource = `
            attribute vec2 aPosition;
            void main() {
                gl_Position = vec4(aPosition, 0.0, 1.0);
            }
        `;

        const fragmentSource = `
            precision highp float;

            uniform vec2 uResolution;
            uniform float uTime;
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            uniform vec3 uSky;
            uniform float uIntensity;
            uniform int uBands;

            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(
                    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
                    u.y
                );
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
                for (int i = 0; i < 5; i++) {
                    v += a * noise(p);
                    p = rot * p * 2.03;
                    a *= 0.5;
                }
                return v;
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / uResolution;
                float aspect = uResolution.x / uResolution.y;
                float t = uTime;

                // cold sky, faintly brighter toward the horizon
                vec3 col = uSky * mix(1.35, 0.45, smoothstep(0.0, 1.0, uv.y));
                col += uSky * 0.5 * fbm(vec2(uv.x * 3.0 * aspect, uv.y * 3.0)) * (1.0 - uv.y);

                // static stars, denser toward the top of the sky
                vec2 sp = uv * vec2(aspect, 1.0) * 110.0;
                vec2 cell = floor(sp);
                float h = hash(cell);
                vec2 o = vec2(hash(cell + 17.0), hash(cell + 41.0)) * 0.6 + 0.2;
                float sd = length(fract(sp) - o);
                float star = smoothstep(0.09, 0.0, sd) * step(0.93, h) * smoothstep(0.25, 0.75, uv.y);
                col += vec3(0.75, 0.85, 1.0) * star * (0.35 + 0.65 * fract(h * 57.0));

                // aurora curtains: bright lower edge fading upward
                float yb = clamp((uv.y - 0.08) / 0.92, 0.0, 1.0);
                float prof = pow(yb, 1.4) * exp(-yb * 2.6) * 10.0;
                vec3 glow = vec3(0.0);
                for (int i = 0; i < 4; i++) {
                    if (i >= uBands) break;
                    float fi = float(i);
                    float base = (fi + 0.5) / float(uBands);
                    float sway = fbm(vec2(uv.y * 1.3 + fi * 7.3, t * 0.22 + fi * 3.1)) - 0.5;
                    float center = base + sway * 0.45;
                    float dx = (uv.x - center) * aspect;
                    float width = 0.11 + 0.07 * noise(vec2(fi * 5.0 + t * 0.15, uv.y * 1.5));
                    float band = exp(-dx * dx / (width * width));
                    float rays = fbm(vec2((uv.x + sway * 0.6) * 11.0 + fi * 17.0, t * 0.55));
                    rays = 0.3 + 2.2 * rays * rays;
                    float shimmer = fbm(vec2(uv.x * 3.5 + fi * 11.0, uv.y * 1.4 - t * 0.4));
                    vec3 c = mix(uColorA, uColorB, clamp(yb * 1.3 + shimmer * 0.3 - 0.25, 0.0, 1.0));
                    glow += c * band * prof * rays * (0.5 + 0.8 * shimmer);
                }
                col += glow * uIntensity * 0.85;

                // gentle tonemap + dither to avoid banding
                col = col / (1.0 + col * 0.35);
                col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                throw new Error(gl.getShaderInfoLog(shader));
            }
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const aPosition = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

        const uniforms = {
            resolution: gl.getUniformLocation(program, 'uResolution'),
            time: gl.getUniformLocation(program, 'uTime'),
            colorA: gl.getUniformLocation(program, 'uColorA'),
            colorB: gl.getUniformLocation(program, 'uColorB'),
            sky: gl.getUniformLocation(program, 'uSky'),
            intensity: gl.getUniformLocation(program, 'uIntensity'),
            bands: gl.getUniformLocation(program, 'uBands')
        };

        function setColorUniform(location, hex) {
            gl.uniform3f(
                location,
                parseInt(hex.slice(1, 3), 16) / 255,
                parseInt(hex.slice(3, 5), 16) / 255,
                parseInt(hex.slice(5, 7), 16) / 255
            );
        }

        const menu = document.getElementById('menu');

        const fields = {
            colorA: document.getElementById('color-a'),
            colorB: document.getElementById('color-b'),
            skyColor: document.getElementById('sky-color'),
            speed: document.getElementById('speed'),
            intensity: document.getElementById('intensity'),
            bands: document.getElementById('bands')
        };

        const outputs = {
            speed: document.getElementById('speed-out'),
            intensity: document.getElementById('intensity-out'),
            bands: document.getElementById('bands-out')
        };

        function currentSettings() {
            return {
                colorA: fields.colorA.value,
                colorB: fields.colorB.value,
                skyColor: fields.skyColor.value,
                speed: Number(fields.speed.value),
                intensity: Number(fields.intensity.value),
                bands: Number(fields.bands.value)
            };
        }

        function persist() {
            if (window.BGEmbed && !BGEmbed.shouldPersist) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentSettings()));
        }

        let waveSpeed = settings.speed;

        function applySettings(shouldPersist = true) {
            const speed = Number(fields.speed.value);
            const intensity = Number(fields.intensity.value);
            const bands = Math.round(Number(fields.bands.value));

            outputs.speed.value = speed.toFixed(2);
            outputs.intensity.value = intensity.toFixed(2);
            outputs.bands.value = String(bands);

            waveSpeed = speed;
            setColorUniform(uniforms.colorA, fields.colorA.value);
            setColorUniform(uniforms.colorB, fields.colorB.value);
            setColorUniform(uniforms.sky, fields.skyColor.value);
            gl.uniform1f(uniforms.intensity, intensity);
            gl.uniform1i(uniforms.bands, bands);

            if (shouldPersist) persist();
        }

        Object.values(fields).forEach((field) => {
            field.addEventListener('input', () => applySettings());
        });

        function resetSettings() {
            fields.colorA.value = DEFAULTS.colorA;
            fields.colorB.value = DEFAULTS.colorB;
            fields.skyColor.value = DEFAULTS.skyColor;
            fields.speed.value = String(DEFAULTS.speed);
            fields.intensity.value = String(DEFAULTS.intensity);
            fields.bands.value = String(DEFAULTS.bands);
            applySettings(false);
            persist();
        }

        document.getElementById('reset').addEventListener('click', resetSettings);
        if (window.BGEmbed) BGEmbed.bindCopyButton(document.getElementById('copy-iframe'), currentSettings, 'Aurora');

        fields.colorA.value = settings.colorA;
        fields.colorB.value = settings.colorB;
        fields.skyColor.value = settings.skyColor;
        fields.speed.value = String(settings.speed);
        fields.intensity.value = String(settings.intensity);
        fields.bands.value = String(settings.bands);
        applySettings(false);

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'Space' || event.repeat) return;
            event.preventDefault();
            menu.classList.toggle('open');
        });

        function onWindowResize() {
            const dpr = Math.min(window.devicePixelRatio, 2);
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
        }

        window.addEventListener('resize', onWindowResize, false);
        onWindowResize();

        let simTime = 0;
        let lastFrame = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);
            const delta = Math.min((now - lastFrame) / 1000, 0.1);
            lastFrame = now;
            simTime += delta * waveSpeed;
            gl.uniform1f(uniforms.time, simTime);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
