<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="embed.js"></script>
    <title>Matrix Rain</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }
        #canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #home {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.6px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(8, 8, 16, 0.5);
            backdrop-filter: blur(12px);
            transition: color 0.2s ease, border-color 0.2s ease;
            z-index: 4;
        }
        #home:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        #menu {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 268px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 14px 14px 12px;
            color: #e8e8f0;
            background: rgba(8, 8, 16, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 3;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #menu header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #menu header span {
            font-size: 11px;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        kbd {
            font-size: 9px;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }
        .section {
            margin-bottom: 12px;
        }
        .section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 7px;
        }
        .bg-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .color-field span {
            font-size: 8px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.38);
        }
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 72px 1fr 36px;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label {
            font-size: 10px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
        }
        .slider-row output {
            font-size: 10px;
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #reset,
        #copy-iframe {
            width: 100%;
            margin-top: 4px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.65);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 6px 0;
            cursor: pointer;
        }
        #reset:hover,
        #copy-iframe:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        html.preview #home,
        html.preview #menu,
        html.preview #loading,
        html.embed #home,
        html.embed #menu,
        html.embed #loading {
            display: none !important;
        }
    </style>
</head>
<body>
    <a id="home" href="../index.html">&#9666; GALLERY</a>
    <aside id="menu">
        <header>
            <span>SETTINGS</span>
            <kbd>SPACE</kbd>
        </header>

        <div class="section">
            <span class="section-label">COLORS</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="glyph-color" value="#00ff41">
                    <span>GLYPHS</span>
                </label>
                <label class="color-field">
                    <input type="color" id="head-color" value="#eafff2">
                    <span>HEAD</span>
                </label>
                <label class="color-field">
                    <input type="color" id="bg-color" value="#000000">
                    <span>BG</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">RAIN</span>
            <div class="slider-row">
                <label for="speed">Fall speed</label>
                <input type="range" id="speed" min="0.2" max="3" step="0.05" value="1">
                <output id="speed-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="density">Density</label>
                <input type="range" id="density" min="0.1" max="3" step="0.05" value="0.85">
                <output id="density-out">0.85</output>
            </div>
            <div class="slider-row">
                <label for="trail">Trail length</label>
                <input type="range" id="trail" min="4" max="80" step="1" value="40">
                <output id="trail-out">40</output>
            </div>
            <div class="slider-row">
                <label for="glyph-size">Glyph size</label>
                <input type="range" id="glyph-size" min="10" max="28" step="1" value="16">
                <output id="glyph-size-out">16</output>
            </div>
        </div>

        <button type="button" id="reset">RESET</button>
        <button type="button" id="copy-iframe">COPY IFRAME</button>
    </aside>
    <canvas id="canvas"></canvas>

    <script>
        const DEFAULTS = {
            glyphColor: '#00ff41',
            headColor: '#eafff2',
            bgColor: '#000000',
            speed: 1,
            density: 0.85,
            trail: 40,
            glyphSize: 16
        };

        const STORAGE_KEY = 'bg-matrix-v1';
        const HEX = /^#[0-9a-fA-F]{6}$/;

        function clamp(value, min, max, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        }

        function loadSettings() {
            try {
                const data = window.BGEmbed ? BGEmbed.rawData(STORAGE_KEY) : JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!data || typeof data !== 'object') return { ...DEFAULTS };

                return {
                    glyphColor: HEX.test(data.glyphColor) ? data.glyphColor : DEFAULTS.glyphColor,
                    headColor: HEX.test(data.headColor) ? data.headColor : DEFAULTS.headColor,
                    bgColor: HEX.test(data.bgColor) ? data.bgColor : DEFAULTS.bgColor,
                    speed: clamp(data.speed, 0.2, 3, DEFAULTS.speed),
                    density: clamp(data.density, 0.1, 3, DEFAULTS.density),
                    trail: Math.round(clamp(data.trail, 4, 80, DEFAULTS.trail)),
                    glyphSize: Math.round(clamp(data.glyphSize, 10, 28, DEFAULTS.glyphSize))
                };
            } catch {
                return { ...DEFAULTS };
            }
        }

        const settings = loadSettings();

        const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+-<>=:';

        function randomGlyph() {
            return GLYPHS[(Math.random() * GLYPHS.length) | 0];
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;

        let glyphColor = settings.glyphColor;
        let headColor = settings.headColor;
        let bgColor = settings.bgColor;
        let bgRgb = { r: 0, g: 0, b: 0 };
        let speed = settings.speed;
        let density = settings.density;
        let trail = settings.trail;
        let glyphSize = settings.glyphSize;

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16)
            };
        }

        let streams = [];
        let colCount = 0;
        let rowCount = 0;
        let offsetX = 0;

        function makeStream(seedAcrossScreen) {
            const y = seedAcrossScreen
                ? Math.random() * rowCount * 1.6 - rowCount * 0.9
                : -(Math.random() * rowCount + 2);
            return {
                col: (Math.random() * colCount) | 0,
                y,
                pace: 0.6 + Math.random() * 0.8,
                lastRow: Math.floor(y),
                lastChar: randomGlyph()
            };
        }

        function applyDensityToStreams(seedAcrossScreen = false) {
            const target = Math.max(1, Math.round(density * colCount));
            while (streams.length < target) {
                streams.push(makeStream(seedAcrossScreen));
            }
            if (streams.length > target) {
                streams.length = target;
            }
        }

        function clearToBackground() {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);
        }

        function rebuildColumns() {
            colCount = Math.max(1, Math.floor(width / glyphSize));
            rowCount = Math.ceil(height / glyphSize);
            offsetX = (width - colCount * glyphSize) / 2;
            streams = [];
            applyDensityToStreams(true);
            ctx.font = `${glyphSize}px "SF Mono", "Menlo", "Consolas", monospace`;
            ctx.textBaseline = 'top';
            clearToBackground();
        }

        function drawGlyph(char, col, row, color) {
            ctx.fillStyle = color;
            ctx.fillText(char, offsetX + col * glyphSize + glyphSize * 0.08, row * glyphSize);
        }

        let lastTime = performance.now();
        let fadeAccum = 0;

        function frame(now) {
            requestAnimationFrame(frame);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            const rowsPerSecond = 13 * speed;

            // Fade the canvas so a stamped glyph takes `trail` rows of head
            // travel to die out. Tiny per-frame alphas can't be represented in
            // 8-bit canvas and leave permanent ghosts, so accumulate the fade
            // and only apply it once it is large enough to take effect.
            const trailSeconds = trail / rowsPerSecond;
            fadeAccum += 1 - Math.pow(0.02, dt / trailSeconds);
            if (fadeAccum >= 0.025) {
                ctx.fillStyle = `rgba(${bgRgb.r}, ${bgRgb.g}, ${bgRgb.b}, ${Math.min(fadeAccum, 0.4)})`;
                ctx.fillRect(0, 0, width, height);
                fadeAccum = 0;
            }

            for (let i = 0; i < streams.length; i++) {
                const stream = streams[i];

                stream.y += stream.pace * rowsPerSecond * dt;
                const targetRow = Math.floor(stream.y);

                while (stream.lastRow < targetRow) {
                    if (stream.lastRow >= 0 && stream.lastRow < rowCount) {
                        drawGlyph(stream.lastChar, stream.col, stream.lastRow, glyphColor);
                    }
                    stream.lastRow += 1;
                    stream.lastChar = randomGlyph();
                }

                if (stream.lastRow >= 0 && stream.lastRow < rowCount) {
                    drawGlyph(stream.lastChar, stream.col, stream.lastRow, headColor);
                }

                if (stream.y > rowCount + 6) {
                    stream.col = (Math.random() * colCount) | 0;
                    stream.y = -(Math.random() * 30 + 2);
                    stream.lastRow = Math.floor(stream.y);
                    stream.pace = 0.6 + Math.random() * 0.8;
                }
            }

            const mutations = Math.max(1, Math.round(streams.length * 0.06));
            for (let m = 0; m < mutations; m++) {
                const stream = streams[(Math.random() * streams.length) | 0];
                if (!stream || stream.lastRow < 3) continue;
                const row = stream.lastRow - 1 - ((Math.random() * Math.min(stream.lastRow, 18)) | 0);
                if (row < 0 || row >= rowCount) continue;
                ctx.fillStyle = bgColor;
                ctx.fillRect(offsetX + stream.col * glyphSize, row * glyphSize, glyphSize, glyphSize + 1);
                ctx.globalAlpha = 0.35 + Math.random() * 0.45;
                drawGlyph(randomGlyph(), stream.col, row, glyphColor);
                ctx.globalAlpha = 1;
            }
        }

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            rebuildColumns();
        }

        const menu = document.getElementById('menu');

        const fields = {
            glyphColor: document.getElementById('glyph-color'),
            headColor: document.getElementById('head-color'),
            bgColor: document.getElementById('bg-color'),
            speed: document.getElementById('speed'),
            density: document.getElementById('density'),
            trail: document.getElementById('trail'),
            glyphSize: document.getElementById('glyph-size')
        };

        const outputs = {
            speed: document.getElementById('speed-out'),
            density: document.getElementById('density-out'),
            trail: document.getElementById('trail-out'),
            glyphSize: document.getElementById('glyph-size-out')
        };

        function currentSettings() {
            return {
                glyphColor: fields.glyphColor.value,
                headColor: fields.headColor.value,
                bgColor: fields.bgColor.value,
                speed: Number(fields.speed.value),
                density: Number(fields.density.value),
                trail: Number(fields.trail.value),
                glyphSize: Number(fields.glyphSize.value)
            };
        }

        function persist() {
            if (window.BGEmbed && !BGEmbed.shouldPersist) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentSettings()));
        }

        function applySettings(shouldPersist = true) {
            glyphColor = fields.glyphColor.value;
            headColor = fields.headColor.value;
            const nextBg = fields.bgColor.value;
            speed = Number(fields.speed.value);
            density = Number(fields.density.value);
            trail = Math.round(Number(fields.trail.value));
            const nextSize = Math.round(Number(fields.glyphSize.value));

            outputs.speed.value = speed.toFixed(2);
            outputs.density.value = density.toFixed(2);
            outputs.trail.value = String(trail);
            outputs.glyphSize.value = String(nextSize);

            const bgChanged = nextBg !== bgColor;
            bgColor = nextBg;
            bgRgb = hexToRgb(bgColor);

            if (nextSize !== glyphSize) {
                glyphSize = nextSize;
                rebuildColumns();
            } else if (bgChanged) {
                clearToBackground();
            }
            applyDensityToStreams();
            if (shouldPersist) persist();
        }

        Object.keys(fields).forEach((key) => {
            fields[key].addEventListener('input', () => applySettings());
        });

        function resetSettings() {
            fields.glyphColor.value = DEFAULTS.glyphColor;
            fields.headColor.value = DEFAULTS.headColor;
            fields.bgColor.value = DEFAULTS.bgColor;
            fields.speed.value = String(DEFAULTS.speed);
            fields.density.value = String(DEFAULTS.density);
            fields.trail.value = String(DEFAULTS.trail);
            fields.glyphSize.value = String(DEFAULTS.glyphSize);
            applySettings(false);
            persist();
        }

        document.getElementById('reset').addEventListener('click', resetSettings);
        if (window.BGEmbed) BGEmbed.bindCopyButton(document.getElementById('copy-iframe'), currentSettings, 'Matrix Rain');

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'Space' || event.repeat) return;
            event.preventDefault();
            menu.classList.toggle('open');
        });

        window.addEventListener('resize', resize, false);

        fields.glyphColor.value = settings.glyphColor;
        fields.headColor.value = settings.headColor;
        fields.bgColor.value = settings.bgColor;
        fields.speed.value = String(settings.speed);
        fields.density.value = String(settings.density);
        fields.trail.value = String(settings.trail);
        fields.glyphSize.value = String(settings.glyphSize);

        bgRgb = hexToRgb(bgColor);
        resize();
        applySettings(false);
        requestAnimationFrame((now) => {
            lastTime = now;
            frame(now);
        });
    </script>
</body>
</html>
