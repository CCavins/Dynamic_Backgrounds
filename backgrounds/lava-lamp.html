<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Lamp</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }
        #scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #home {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.6px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(8, 8, 16, 0.5);
            backdrop-filter: blur(12px);
            transition: color 0.2s ease, border-color 0.2s ease;
            z-index: 4;
        }
        #home:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        #menu {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 268px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 14px 14px 12px;
            color: #e8e8f0;
            background: rgba(8, 8, 16, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 3;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #menu header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #menu header span {
            font-size: 11px;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        kbd {
            font-size: 9px;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }
        .section {
            margin-bottom: 12px;
        }
        .section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 7px;
        }
        .bg-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .color-field span {
            font-size: 8px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.38);
        }
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 72px 1fr 36px;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label {
            font-size: 10px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
        }
        .slider-row output {
            font-size: 10px;
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #reset {
            width: 100%;
            margin-top: 4px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.65);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 6px 0;
            cursor: pointer;
        }
        #reset:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <a id="home" href="../index.html">&#9666; GALLERY</a>
    <aside id="menu">
        <header>
            <span>SETTINGS</span>
            <kbd>SPACE</kbd>
        </header>

        <div class="section">
            <span class="section-label">BLOB COLORS</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="blob-a" value="#ff9a3c">
                    <span>TOP</span>
                </label>
                <label class="color-field">
                    <input type="color" id="blob-b" value="#ff3d81">
                    <span>BOTTOM</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">BACKGROUND</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="bg-top" value="#12081f">
                    <span>TOP</span>
                </label>
                <label class="color-field">
                    <input type="color" id="bg-bottom" value="#2b0f35">
                    <span>BOTTOM</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">LAVA</span>
            <div class="slider-row">
                <label for="speed">Speed</label>
                <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
                <output id="speed-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="count">Blobs</label>
                <input type="range" id="count" min="2" max="10" step="1" value="6">
                <output id="count-out">6</output>
            </div>
            <div class="slider-row">
                <label for="size">Blob size</label>
                <input type="range" id="size" min="0.5" max="2" step="0.05" value="1">
                <output id="size-out">1.00</output>
            </div>
        </div>

        <button type="button" id="reset">RESET</button>
    </aside>

    <script>
        const STORAGE_KEY = 'bg-lava-lamp-v1';
        const HEX = /^#[0-9a-fA-F]{6}$/;

        const DEFAULTS = {
            blobA: '#ff9a3c',
            blobB: '#ff3d81',
            bgTop: '#12081f',
            bgBottom: '#2b0f35',
            speed: 1,
            count: 6,
            size: 1
        };

        function clamp(value, min, max, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        }

        function loadSettings() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!data || typeof data !== 'object') return { ...DEFAULTS };
                return {
                    blobA: HEX.test(data.blobA) ? data.blobA : DEFAULTS.blobA,
                    blobB: HEX.test(data.blobB) ? data.blobB : DEFAULTS.blobB,
                    bgTop: HEX.test(data.bgTop) ? data.bgTop : DEFAULTS.bgTop,
                    bgBottom: HEX.test(data.bgBottom) ? data.bgBottom : DEFAULTS.bgBottom,
                    speed: clamp(data.speed, 0, 3, DEFAULTS.speed),
                    count: Math.round(clamp(data.count, 2, 10, DEFAULTS.count)),
                    size: clamp(data.size, 0.5, 2, DEFAULTS.size)
                };
            } catch {
                return { ...DEFAULTS };
            }
        }

        const settings = loadSettings();

        const menu = document.getElementById('menu');
        const fields = {
            blobA: document.getElementById('blob-a'),
            blobB: document.getElementById('blob-b'),
            bgTop: document.getElementById('bg-top'),
            bgBottom: document.getElementById('bg-bottom'),
            speed: document.getElementById('speed'),
            count: document.getElementById('count'),
            size: document.getElementById('size')
        };
        const outputs = {
            speed: document.getElementById('speed-out'),
            count: document.getElementById('count-out'),
            size: document.getElementById('size-out')
        };

        function hexToRgb(hex) {
            return [
                parseInt(hex.slice(1, 3), 16) / 255,
                parseInt(hex.slice(3, 5), 16) / 255,
                parseInt(hex.slice(5, 7), 16) / 255
            ];
        }

        const state = {
            blobA: hexToRgb(settings.blobA),
            blobB: hexToRgb(settings.blobB),
            bgTop: hexToRgb(settings.bgTop),
            bgBottom: hexToRgb(settings.bgBottom),
            speed: settings.speed,
            count: settings.count,
            size: settings.size
        };

        function persist() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                blobA: fields.blobA.value,
                blobB: fields.blobB.value,
                bgTop: fields.bgTop.value,
                bgBottom: fields.bgBottom.value,
                speed: Number(fields.speed.value),
                count: Number(fields.count.value),
                size: Number(fields.size.value)
            }));
        }

        function applySettings(shouldPersist = true) {
            state.blobA = hexToRgb(fields.blobA.value);
            state.blobB = hexToRgb(fields.blobB.value);
            state.bgTop = hexToRgb(fields.bgTop.value);
            state.bgBottom = hexToRgb(fields.bgBottom.value);
            state.speed = Number(fields.speed.value);
            state.count = Math.round(Number(fields.count.value));
            state.size = Number(fields.size.value);

            outputs.speed.value = state.speed.toFixed(2);
            outputs.count.value = String(state.count);
            outputs.size.value = state.size.toFixed(2);

            if (shouldPersist) persist();
        }

        Object.values(fields).forEach((input) => {
            input.addEventListener('input', () => applySettings());
        });

        function resetSettings() {
            fields.blobA.value = DEFAULTS.blobA;
            fields.blobB.value = DEFAULTS.blobB;
            fields.bgTop.value = DEFAULTS.bgTop;
            fields.bgBottom.value = DEFAULTS.bgBottom;
            fields.speed.value = String(DEFAULTS.speed);
            fields.count.value = String(DEFAULTS.count);
            fields.size.value = String(DEFAULTS.size);
            applySettings(false);
            persist();
        }

        document.getElementById('reset').addEventListener('click', resetSettings);

        fields.blobA.value = settings.blobA;
        fields.blobB.value = settings.blobB;
        fields.bgTop.value = settings.bgTop;
        fields.bgBottom.value = settings.bgBottom;
        fields.speed.value = String(settings.speed);
        fields.count.value = String(settings.count);
        fields.size.value = String(settings.size);
        applySettings(false);

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'Space' || event.repeat) return;
            event.preventDefault();
            menu.classList.toggle('open');
        });

        const canvas = document.getElementById('scene');
        const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

        const vertexSource = `
            attribute vec2 aPosition;
            void main() {
                gl_Position = vec4(aPosition, 0.0, 1.0);
            }
        `;

        const fragmentSource = `
            precision highp float;

            const int MAX_BLOBS = 10;

            uniform vec2 uResolution;
            uniform float uCount;
            uniform vec3 uBlobs[MAX_BLOBS];
            uniform vec3 uBlobA;
            uniform vec3 uBlobB;
            uniform vec3 uBgTop;
            uniform vec3 uBgBottom;

            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / uResolution;
                vec2 p = (uv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);

                float field = 0.0;
                float mixAcc = 0.0;
                for (int i = 0; i < MAX_BLOBS; i++) {
                    if (float(i) >= uCount) break;
                    vec3 blob = uBlobs[i];
                    vec2 d = p - blob.xy;
                    float w = (blob.z * blob.z) / (dot(d, d) + 0.0001);
                    field += w;
                    mixAcc += w * clamp(blob.y / 0.9 + 0.5, 0.0, 1.0);
                }

                float body = smoothstep(0.92, 1.08, field);
                float inner = smoothstep(0.95, 2.4, field);
                float yMix = mixAcc / max(field, 0.0001);

                vec3 blobCol = mix(uBlobB, uBlobA, yMix);
                vec3 core = blobCol * (0.92 + 0.4 * inner);

                vec3 bg = mix(uBgBottom, uBgTop, smoothstep(0.0, 1.0, uv.y));

                float glow = pow(clamp(field / 0.92, 0.0, 1.0), 3.0) * (1.0 - body);
                float rim = smoothstep(0.86, 1.0, field) * (1.0 - smoothstep(1.05, 1.5, field));

                vec3 col = mix(bg, core, body);
                col += blobCol * glow * 0.4;
                col += mix(blobCol, vec3(1.0), 0.55) * rim * 0.07;

                col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function makeShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, makeShader(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, makeShader(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const aPosition = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

        const uniforms = {
            uResolution: gl.getUniformLocation(program, 'uResolution'),
            uCount: gl.getUniformLocation(program, 'uCount'),
            uBlobs: gl.getUniformLocation(program, 'uBlobs'),
            uBlobA: gl.getUniformLocation(program, 'uBlobA'),
            uBlobB: gl.getUniformLocation(program, 'uBlobB'),
            uBgTop: gl.getUniformLocation(program, 'uBgTop'),
            uBgBottom: gl.getUniformLocation(program, 'uBgBottom')
        };

        const MAX_BLOBS = 10;
        const blobData = new Float32Array(MAX_BLOBS * 3);

        function seeded(index, salt) {
            const value = Math.sin(index * 127.1 + salt * 311.7) * 43758.5453;
            return value - Math.floor(value);
        }

        const blobSeeds = [];
        for (let i = 0; i < MAX_BLOBS; i++) {
            blobSeeds.push({
                // Golden-ratio sequence keeps any prefix of blobs evenly spread.
                baseX: (((i * 0.6180339887 + 0.37) % 1) - 0.5) * 1.7,
                riseSpeed: 0.10 + seeded(i, 1) * 0.14,
                risePhase: seeded(i, 2) * Math.PI * 2,
                swaySpeed: 0.14 + seeded(i, 3) * 0.18,
                swayPhase: seeded(i, 4) * Math.PI * 2,
                radius: 0.075 + seeded(i, 5) * 0.075
            });
        }

        function updateBlobs(time) {
            const halfWidth = (canvas.width / canvas.height) * 0.5;
            for (let i = 0; i < state.count; i++) {
                const seed = blobSeeds[i];
                const spread = halfWidth * 0.82;
                blobData[i * 3] = seed.baseX * spread
                    + Math.sin(time * seed.swaySpeed + seed.swayPhase) * 0.09;
                blobData[i * 3 + 1] = Math.sin(time * seed.riseSpeed + seed.risePhase) * 0.42;
                blobData[i * 3 + 2] = seed.radius * state.size;
            }
        }

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize, false);
        resize();

        let simTime = 0;
        let lastFrame = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastFrame) / 1000, 0.1);
            lastFrame = now;
            simTime += dt * state.speed;

            updateBlobs(simTime);

            gl.uniform2f(uniforms.uResolution, canvas.width, canvas.height);
            gl.uniform1f(uniforms.uCount, state.count);
            gl.uniform3fv(uniforms.uBlobs, blobData);
            gl.uniform3fv(uniforms.uBlobA, state.blobA);
            gl.uniform3fv(uniforms.uBlobB, state.blobB);
            gl.uniform3fv(uniforms.uBgTop, state.bgTop);
            gl.uniform3fv(uniforms.uBgBottom, state.bgBottom);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
