<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (new URLSearchParams(location.search).has('preview')) {
            document.documentElement.classList.add('preview');
        }
    </script>
    <title>Clouds</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }
        #scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #home {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.6px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(8, 8, 16, 0.5);
            backdrop-filter: blur(12px);
            transition: color 0.2s ease, border-color 0.2s ease;
            z-index: 4;
        }
        #home:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        #menu {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 268px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 14px 14px 12px;
            color: #e8e8f0;
            background: rgba(8, 8, 16, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 3;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #menu header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #menu header span {
            font-size: 11px;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        kbd {
            font-size: 9px;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }
        .section {
            margin-bottom: 12px;
        }
        .section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 7px;
        }
        .bg-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .color-field span {
            font-size: 8px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.38);
        }
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 72px 1fr 36px;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label {
            font-size: 10px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
        }
        .slider-row output {
            font-size: 10px;
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #reset {
            width: 100%;
            margin-top: 4px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.65);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 6px 0;
            cursor: pointer;
        }
        #reset:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        html.preview #home,
        html.preview #menu,
        html.preview #loading {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <a id="home" href="../index.html">&#9666; GALLERY</a>
    <aside id="menu">
        <header>
            <span>SETTINGS</span>
            <kbd>SPACE</kbd>
        </header>

        <div class="section">
            <span class="section-label">SKY</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="sky-top" value="#3576cf">
                    <span>TOP</span>
                </label>
                <label class="color-field">
                    <input type="color" id="sky-bottom" value="#bfe0f5">
                    <span>BOTTOM</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">CLOUDS</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="cloud-color" value="#ffffff">
                    <span>CLOUD</span>
                </label>
                <label class="color-field">
                    <input type="color" id="shadow-color" value="#8fa9c4">
                    <span>SHADOW</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">WEATHER</span>
            <div class="slider-row">
                <label for="speed">Drift</label>
                <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
                <output id="speed-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="coverage">Coverage</label>
                <input type="range" id="coverage" min="0" max="1" step="0.01" value="0.5">
                <output id="coverage-out">0.50</output>
            </div>
            <div class="slider-row">
                <label for="softness">Softness</label>
                <input type="range" id="softness" min="0" max="1" step="0.01" value="0.5">
                <output id="softness-out">0.50</output>
            </div>
        </div>

        <button type="button" id="reset">RESET</button>
    </aside>

    <script>
        const STORAGE_KEY = 'bg-clouds-v1';
        const HEX = /^#[0-9a-fA-F]{6}$/;

        const DEFAULTS = {
            skyTop: '#3576cf',
            skyBottom: '#bfe0f5',
            cloudColor: '#ffffff',
            shadowColor: '#8fa9c4',
            speed: 1,
            coverage: 0.5,
            softness: 0.5
        };

        function clamp(value, min, max, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        }

        function loadSettings() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!data || typeof data !== 'object') return { ...DEFAULTS };
                return {
                    skyTop: HEX.test(data.skyTop) ? data.skyTop : DEFAULTS.skyTop,
                    skyBottom: HEX.test(data.skyBottom) ? data.skyBottom : DEFAULTS.skyBottom,
                    cloudColor: HEX.test(data.cloudColor) ? data.cloudColor : DEFAULTS.cloudColor,
                    shadowColor: HEX.test(data.shadowColor) ? data.shadowColor : DEFAULTS.shadowColor,
                    speed: clamp(data.speed, 0, 3, DEFAULTS.speed),
                    coverage: clamp(data.coverage, 0, 1, DEFAULTS.coverage),
                    softness: clamp(data.softness, 0, 1, DEFAULTS.softness)
                };
            } catch {
                return { ...DEFAULTS };
            }
        }

        const settings = loadSettings();

        const menu = document.getElementById('menu');
        const fields = {
            skyTop: document.getElementById('sky-top'),
            skyBottom: document.getElementById('sky-bottom'),
            cloudColor: document.getElementById('cloud-color'),
            shadowColor: document.getElementById('shadow-color'),
            speed: document.getElementById('speed'),
            coverage: document.getElementById('coverage'),
            softness: document.getElementById('softness')
        };
        const outputs = {
            speed: document.getElementById('speed-out'),
            coverage: document.getElementById('coverage-out'),
            softness: document.getElementById('softness-out')
        };

        function hexToRgb(hex) {
            return [
                parseInt(hex.slice(1, 3), 16) / 255,
                parseInt(hex.slice(3, 5), 16) / 255,
                parseInt(hex.slice(5, 7), 16) / 255
            ];
        }

        const state = {
            skyTop: hexToRgb(settings.skyTop),
            skyBottom: hexToRgb(settings.skyBottom),
            cloudColor: hexToRgb(settings.cloudColor),
            shadowColor: hexToRgb(settings.shadowColor),
            speed: settings.speed,
            coverage: settings.coverage,
            softness: settings.softness
        };

        function persist() {
            if (document.documentElement.classList.contains('preview')) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                skyTop: fields.skyTop.value,
                skyBottom: fields.skyBottom.value,
                cloudColor: fields.cloudColor.value,
                shadowColor: fields.shadowColor.value,
                speed: Number(fields.speed.value),
                coverage: Number(fields.coverage.value),
                softness: Number(fields.softness.value)
            }));
        }

        function applySettings(shouldPersist = true) {
            state.skyTop = hexToRgb(fields.skyTop.value);
            state.skyBottom = hexToRgb(fields.skyBottom.value);
            state.cloudColor = hexToRgb(fields.cloudColor.value);
            state.shadowColor = hexToRgb(fields.shadowColor.value);
            state.speed = Number(fields.speed.value);
            state.coverage = Number(fields.coverage.value);
            state.softness = Number(fields.softness.value);

            outputs.speed.value = state.speed.toFixed(2);
            outputs.coverage.value = state.coverage.toFixed(2);
            outputs.softness.value = state.softness.toFixed(2);

            if (shouldPersist) persist();
        }

        Object.values(fields).forEach((input) => {
            input.addEventListener('input', () => applySettings());
        });

        function resetSettings() {
            fields.skyTop.value = DEFAULTS.skyTop;
            fields.skyBottom.value = DEFAULTS.skyBottom;
            fields.cloudColor.value = DEFAULTS.cloudColor;
            fields.shadowColor.value = DEFAULTS.shadowColor;
            fields.speed.value = String(DEFAULTS.speed);
            fields.coverage.value = String(DEFAULTS.coverage);
            fields.softness.value = String(DEFAULTS.softness);
            applySettings(false);
            persist();
        }

        document.getElementById('reset').addEventListener('click', resetSettings);

        fields.skyTop.value = settings.skyTop;
        fields.skyBottom.value = settings.skyBottom;
        fields.cloudColor.value = settings.cloudColor;
        fields.shadowColor.value = settings.shadowColor;
        fields.speed.value = String(settings.speed);
        fields.coverage.value = String(settings.coverage);
        fields.softness.value = String(settings.softness);
        applySettings(false);

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'Space' || event.repeat) return;
            event.preventDefault();
            menu.classList.toggle('open');
        });

        const canvas = document.getElementById('scene');
        const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

        const vertexSource = `
            attribute vec2 aPosition;
            void main() {
                gl_Position = vec4(aPosition, 0.0, 1.0);
            }
        `;

        const fragmentSource = `
            precision highp float;

            uniform vec2 uResolution;
            uniform float uTime;
            uniform float uCoverage;
            uniform float uSoftness;
            uniform vec3 uSkyTop;
            uniform vec3 uSkyBottom;
            uniform vec3 uCloud;
            uniform vec3 uShadow;

            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(
                    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
                    u.y
                );
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
                for (int i = 0; i < 5; i++) {
                    v += a * noise(p);
                    p = rot * p * 2.03;
                    a *= 0.5;
                }
                return v;
            }

            vec3 cloudLayer(vec3 col, vec2 suv, float scale, float drift, float alpha, float threshold, float soft) {
                vec2 p = vec2(suv.x * scale + uTime * drift, suv.y * scale * 1.5 + scale * 7.31);
                float density = fbm(p);
                float cover = smoothstep(threshold, threshold + soft, density);
                float interior = smoothstep(threshold, threshold + soft + 0.22, density);

                float above = fbm(p + vec2(0.05, 0.16));
                float under = clamp((above - density) * 5.0, 0.0, 1.0);
                float sunny = clamp((density - above) * 5.0, 0.0, 1.0);

                vec3 cloudCol = mix(uCloud, uShadow, under * (0.45 + 0.4 * interior));
                cloudCol = mix(cloudCol, min(uCloud * 1.08, vec3(1.0)), sunny * interior * 0.5);

                return mix(col, cloudCol, cover * alpha);
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / uResolution;
                vec2 suv = vec2(uv.x * uResolution.x / uResolution.y, uv.y);

                vec3 col = mix(uSkyBottom, uSkyTop, smoothstep(0.0, 1.0, pow(uv.y, 0.85)));

                float threshold = mix(0.70, 0.30, uCoverage);
                float soft = mix(0.05, 0.30, uSoftness);

                col = cloudLayer(col, suv, 2.0, 0.014, 0.62, threshold + 0.06, soft + 0.06);
                col = cloudLayer(col, suv, 1.05, 0.032, 1.0, threshold, soft);

                col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function makeShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, makeShader(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, makeShader(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const aPosition = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

        const uniforms = {
            uResolution: gl.getUniformLocation(program, 'uResolution'),
            uTime: gl.getUniformLocation(program, 'uTime'),
            uCoverage: gl.getUniformLocation(program, 'uCoverage'),
            uSoftness: gl.getUniformLocation(program, 'uSoftness'),
            uSkyTop: gl.getUniformLocation(program, 'uSkyTop'),
            uSkyBottom: gl.getUniformLocation(program, 'uSkyBottom'),
            uCloud: gl.getUniformLocation(program, 'uCloud'),
            uShadow: gl.getUniformLocation(program, 'uShadow')
        };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize, false);
        resize();

        let simTime = 0;
        let lastFrame = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastFrame) / 1000, 0.1);
            lastFrame = now;
            simTime += dt * state.speed;

            gl.uniform2f(uniforms.uResolution, canvas.width, canvas.height);
            gl.uniform1f(uniforms.uTime, simTime);
            gl.uniform1f(uniforms.uCoverage, state.coverage);
            gl.uniform1f(uniforms.uSoftness, state.softness);
            gl.uniform3fv(uniforms.uSkyTop, state.skyTop);
            gl.uniform3fv(uniforms.uSkyBottom, state.skyBottom);
            gl.uniform3fv(uniforms.uCloud, state.cloudColor);
            gl.uniform3fv(uniforms.uShadow, state.shadowColor);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
