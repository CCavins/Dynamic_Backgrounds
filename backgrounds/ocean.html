<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="embed.js"></script>
    <title>Ocean</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }
        #canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #home {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.6px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(8, 8, 16, 0.5);
            backdrop-filter: blur(12px);
            transition: color 0.2s ease, border-color 0.2s ease;
            z-index: 4;
        }
        #home:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        #menu {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 268px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 14px 14px 12px;
            color: #e8e8f0;
            background: rgba(8, 8, 16, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 3;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #menu header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #menu header span {
            font-size: 11px;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        kbd {
            font-size: 9px;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }
        .section {
            margin-bottom: 12px;
        }
        .section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 7px;
        }
        .bg-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .color-field span {
            font-size: 8px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.38);
        }
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 72px 1fr 36px;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label {
            font-size: 10px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
        }
        .slider-row output {
            font-size: 10px;
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #reset,
        #copy-iframe {
            width: 100%;
            margin-top: 4px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.65);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 6px 0;
            cursor: pointer;
        }
        #reset:hover,
        #copy-iframe:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        html.preview #home,
        html.preview #menu,
        html.preview #loading,
        html.embed #home,
        html.embed #menu,
        html.embed #loading {
            display: none !important;
        }
    </style>
</head>
<body>
    <a id="home" href="../backgrounds.html">&#9666; GALLERY</a>
    <aside id="menu">
        <header>
            <span>SETTINGS</span>
            <kbd>SPACE</kbd>
        </header>

        <div class="section">
            <span class="section-label">WATER</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="water-top" value="#0d5c8c">
                    <span>TOP</span>
                </label>
                <label class="color-field">
                    <input type="color" id="water-bottom" value="#021224">
                    <span>BOTTOM</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">LIGHT RAYS</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="ray-color" value="#bfe8ff">
                    <span>RAYS</span>
                </label>
            </div>
            <div class="slider-row">
                <label for="ray-intensity">Intensity</label>
                <input type="range" id="ray-intensity" min="0" max="2" step="0.05" value="1">
                <output id="ray-intensity-out">1.00</output>
            </div>
        </div>

        <div class="section">
            <span class="section-label">BUBBLES</span>
            <div class="slider-row">
                <label for="bubble-density">Density</label>
                <input type="range" id="bubble-density" min="0" max="100" step="1" value="40">
                <output id="bubble-density-out">40</output>
            </div>
            <div class="slider-row">
                <label for="bubble-speed">Speed</label>
                <input type="range" id="bubble-speed" min="0.2" max="3" step="0.05" value="1">
                <output id="bubble-speed-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="bubble-size">Size</label>
                <input type="range" id="bubble-size" min="0.3" max="3" step="0.05" value="1">
                <output id="bubble-size-out">1.00</output>
            </div>
        </div>

        <button type="button" id="reset">RESET</button>
        <button type="button" id="copy-iframe">COPY IFRAME</button>
    </aside>
    <canvas id="canvas"></canvas>

    <script>
        const DEFAULTS = {
            waterTop: '#0d5c8c',
            waterBottom: '#021224',
            rayColor: '#bfe8ff',
            rayIntensity: 1,
            bubbleDensity: 40,
            bubbleSpeed: 1,
            bubbleSize: 1
        };

        const STORAGE_KEY = 'bg-ocean-v1';
        const HEX = /^#[0-9a-fA-F]{6}$/;

        function clamp(value, min, max, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        }

        function loadSettings() {
            try {
                const data = window.BGEmbed ? BGEmbed.rawData(STORAGE_KEY) : JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!data || typeof data !== 'object') return { ...DEFAULTS };

                return {
                    waterTop: HEX.test(data.waterTop) ? data.waterTop : DEFAULTS.waterTop,
                    waterBottom: HEX.test(data.waterBottom) ? data.waterBottom : DEFAULTS.waterBottom,
                    rayColor: HEX.test(data.rayColor) ? data.rayColor : DEFAULTS.rayColor,
                    rayIntensity: clamp(data.rayIntensity, 0, 2, DEFAULTS.rayIntensity),
                    bubbleDensity: Math.round(clamp(data.bubbleDensity, 0, 100, DEFAULTS.bubbleDensity)),
                    bubbleSpeed: clamp(data.bubbleSpeed, 0.2, 3, DEFAULTS.bubbleSpeed),
                    bubbleSize: clamp(data.bubbleSize, 0.3, 3, DEFAULTS.bubbleSize)
                };
            } catch {
                return { ...DEFAULTS };
            }
        }

        const settings = loadSettings();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let waterGradient = null;

        let waterTop = settings.waterTop;
        let waterBottom = settings.waterBottom;
        let rayColor = settings.rayColor;
        let rayRgb = { r: 191, g: 232, b: 255 };
        let rayIntensity = settings.rayIntensity;
        let bubbleDensity = settings.bubbleDensity;
        let bubbleSpeed = settings.bubbleSpeed;
        let bubbleSize = settings.bubbleSize;

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16)
            };
        }

        function hash(n) {
            const s = Math.sin(n) * 43758.5453123;
            return s - Math.floor(s);
        }

        function noise2(x, y) {
            const xi = Math.floor(x);
            const yi = Math.floor(y);
            const xf = x - xi;
            const yf = y - yi;
            const u = xf * xf * (3 - 2 * xf);
            const v = yf * yf * (3 - 2 * yf);
            const a = hash(xi * 127.1 + yi * 311.7);
            const b = hash((xi + 1) * 127.1 + yi * 311.7);
            const c = hash(xi * 127.1 + (yi + 1) * 311.7);
            const d = hash((xi + 1) * 127.1 + (yi + 1) * 311.7);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }

        function rebuildWaterGradient() {
            waterGradient = ctx.createLinearGradient(0, 0, 0, height);
            waterGradient.addColorStop(0, waterTop);
            waterGradient.addColorStop(1, waterBottom);
        }

        const RAYS = [
            { x: 0.14, tilt: 0.30, w: 130, sway: 0.21, phase: 0.0 },
            { x: 0.36, tilt: 0.22, w: 200, sway: 0.16, phase: 2.1 },
            { x: 0.58, tilt: 0.27, w: 105, sway: 0.26, phase: 4.4 },
            { x: 0.80, tilt: 0.19, w: 175, sway: 0.13, phase: 1.3 }
        ];

        const raySprite = document.createElement('canvas');

        function buildRaySprite() {
            const spriteWidth = 256;
            const spriteHeight = 1024;
            raySprite.width = spriteWidth;
            raySprite.height = spriteHeight;
            const spriteCtx = raySprite.getContext('2d');
            const across = spriteCtx.createLinearGradient(0, 0, spriteWidth, 0);
            across.addColorStop(0, `rgba(${rayRgb.r}, ${rayRgb.g}, ${rayRgb.b}, 0)`);
            across.addColorStop(0.5, `rgba(${rayRgb.r}, ${rayRgb.g}, ${rayRgb.b}, 1)`);
            across.addColorStop(1, `rgba(${rayRgb.r}, ${rayRgb.g}, ${rayRgb.b}, 0)`);
            spriteCtx.fillStyle = across;
            spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);
            const along = spriteCtx.createLinearGradient(0, 0, 0, spriteHeight);
            along.addColorStop(0, 'rgba(255, 255, 255, 1)');
            along.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
            along.addColorStop(1, 'rgba(255, 255, 255, 0)');
            spriteCtx.globalCompositeOperation = 'destination-in';
            spriteCtx.fillStyle = along;
            spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);
            spriteCtx.globalCompositeOperation = 'source-over';
        }

        function drawRays(time) {
            if (rayIntensity <= 0) return;
            ctx.globalCompositeOperation = 'lighter';
            const length = height * 1.3;
            for (const ray of RAYS) {
                const sway = Math.sin(time * ray.sway + ray.phase);
                const anchorX = width * ray.x + sway * 36;
                const angle = ray.tilt + sway * 0.05;
                const rayWidth = ray.w * (1 + 0.28 * Math.sin(time * ray.sway * 1.4 + ray.phase * 1.7));
                const shimmer = 0.65 + 0.35 * noise2(ray.phase * 3.1, time * 0.35);

                ctx.save();
                ctx.translate(anchorX, -60);
                ctx.rotate(angle);
                ctx.globalAlpha = 0.24 * rayIntensity * shimmer;
                ctx.drawImage(raySprite, -rayWidth, 0, rayWidth * 2, length);
                ctx.restore();
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        const causticStrip = document.createElement('canvas');

        function buildCausticStrip() {
            causticStrip.width = 32;
            causticStrip.height = 256;
            const stripCtx = causticStrip.getContext('2d');
            const gradient = stripCtx.createLinearGradient(0, 0, 0, 256);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
            gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            stripCtx.fillStyle = gradient;
            stripCtx.fillRect(0, 0, 32, 256);
            const feather = stripCtx.createLinearGradient(0, 0, 32, 0);
            feather.addColorStop(0, 'rgba(255, 255, 255, 0)');
            feather.addColorStop(0.5, 'rgba(255, 255, 255, 1)');
            feather.addColorStop(1, 'rgba(255, 255, 255, 0)');
            stripCtx.globalCompositeOperation = 'destination-in';
            stripCtx.fillStyle = feather;
            stripCtx.fillRect(0, 0, 32, 256);
            stripCtx.globalCompositeOperation = 'source-over';
        }

        function drawCaustics(time) {
            if (rayIntensity <= 0) return;
            ctx.globalCompositeOperation = 'lighter';

            const glow = ctx.createLinearGradient(0, 0, 0, height * 0.16);
            glow.addColorStop(0, `rgba(${rayRgb.r}, ${rayRgb.g}, ${rayRgb.b}, ${0.1 * rayIntensity})`);
            glow.addColorStop(1, `rgba(${rayRgb.r}, ${rayRgb.g}, ${rayRgb.b}, 0)`);
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height * 0.16);

            const columnCount = 64;
            const columnWidth = width / columnCount;
            const stripHeight = height * 0.15;
            for (let i = 0; i < columnCount; i++) {
                const n = noise2(i * 0.42, time * 0.55) * 0.65 + noise2(i * 1.3 + 40, time * 0.9) * 0.35;
                const brightness = Math.pow(n, 3) * 0.55 * rayIntensity;
                if (brightness < 0.01) continue;
                ctx.globalAlpha = brightness;
                ctx.drawImage(causticStrip, (i - 1) * columnWidth, 0, columnWidth * 3, stripHeight);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        const bubbleSprite = document.createElement('canvas');

        function buildBubbleSprite() {
            const size = 64;
            bubbleSprite.width = size;
            bubbleSprite.height = size;
            const spriteCtx = bubbleSprite.getContext('2d');
            const half = size / 2;
            const body = spriteCtx.createRadialGradient(half, half, half * 0.2, half, half, half);
            body.addColorStop(0, 'rgba(255, 255, 255, 0.03)');
            body.addColorStop(0.62, 'rgba(255, 255, 255, 0.05)');
            body.addColorStop(0.84, 'rgba(255, 255, 255, 0.3)');
            body.addColorStop(0.96, 'rgba(255, 255, 255, 0.5)');
            body.addColorStop(1, 'rgba(255, 255, 255, 0)');
            spriteCtx.fillStyle = body;
            spriteCtx.fillRect(0, 0, size, size);
            const highlight = spriteCtx.createRadialGradient(size * 0.34, size * 0.3, 0, size * 0.34, size * 0.3, size * 0.16);
            highlight.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
            highlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
            spriteCtx.fillStyle = highlight;
            spriteCtx.fillRect(0, 0, size, size);
        }

        const bubbles = [];

        function makeBubble(spawnAnywhere) {
            const baseRadius = 1.5 + Math.pow(Math.random(), 2.2) * 6.5;
            return {
                baseX: Math.random() * width,
                y: spawnAnywhere ? Math.random() * height : height + 12 + Math.random() * 60,
                baseRadius,
                rise: (0.35 + baseRadius * 0.11 + Math.random() * 0.3) * 60,
                wobbleAmp: 5 + Math.random() * 14,
                wobbleFreq: 0.6 + Math.random() * 1.1,
                wobblePhase: Math.random() * Math.PI * 2,
                opacity: 0.35 + Math.random() * 0.5,
                surfaceY: 0.04 + Math.random() * 0.05,
                pop: 0
            };
        }

        function rebuildBubbles() {
            const target = Math.round(bubbleDensity * width / 900);
            while (bubbles.length < target) bubbles.push(makeBubble(true));
            bubbles.length = target;
        }

        function updateAndDrawBubbles(time, dt) {
            ctx.globalCompositeOperation = 'lighter';
            for (const bubble of bubbles) {
                if (bubble.pop > 0) {
                    bubble.pop += dt * 4;
                    if (bubble.pop >= 1) {
                        Object.assign(bubble, makeBubble(false));
                        continue;
                    }
                } else {
                    bubble.y -= bubble.rise * bubbleSpeed * dt;
                    if (bubble.y < height * bubble.surfaceY) bubble.pop = 0.001;
                }
                const x = bubble.baseX + Math.sin(time * bubble.wobbleFreq + bubble.wobblePhase) * bubble.wobbleAmp;
                const scale = 1 + bubble.pop * 0.7;
                const drawRadius = bubble.baseRadius * bubbleSize * scale;
                ctx.globalAlpha = bubble.opacity * (1 - bubble.pop);
                ctx.drawImage(bubbleSprite, x - drawRadius, bubble.y - drawRadius, drawRadius * 2, drawRadius * 2);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            rebuildWaterGradient();
            rebuildBubbles();
        }

        let lastTime = performance.now();

        function frame(now) {
            requestAnimationFrame(frame);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            const time = now / 1000;

            ctx.fillStyle = waterGradient;
            ctx.fillRect(0, 0, width, height);

            drawRays(time);
            updateAndDrawBubbles(time, dt);
            drawCaustics(time);
        }

        const menu = document.getElementById('menu');

        const fields = {
            waterTop: document.getElementById('water-top'),
            waterBottom: document.getElementById('water-bottom'),
            rayColor: document.getElementById('ray-color'),
            rayIntensity: document.getElementById('ray-intensity'),
            bubbleDensity: document.getElementById('bubble-density'),
            bubbleSpeed: document.getElementById('bubble-speed'),
            bubbleSize: document.getElementById('bubble-size')
        };

        const outputs = {
            rayIntensity: document.getElementById('ray-intensity-out'),
            bubbleDensity: document.getElementById('bubble-density-out'),
            bubbleSpeed: document.getElementById('bubble-speed-out'),
            bubbleSize: document.getElementById('bubble-size-out')
        };

        function currentSettings() {
            return {
                waterTop: fields.waterTop.value,
                waterBottom: fields.waterBottom.value,
                rayColor: fields.rayColor.value,
                rayIntensity: Number(fields.rayIntensity.value),
                bubbleDensity: Number(fields.bubbleDensity.value),
                bubbleSpeed: Number(fields.bubbleSpeed.value),
                bubbleSize: Number(fields.bubbleSize.value)
            };
        }

        function persist() {
            if (window.BGEmbed && !BGEmbed.shouldPersist) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentSettings()));
        }

        function applySettings(shouldPersist = true) {
            waterTop = fields.waterTop.value;
            waterBottom = fields.waterBottom.value;
            rayColor = fields.rayColor.value;
            rayRgb = hexToRgb(rayColor);
            rayIntensity = Number(fields.rayIntensity.value);
            bubbleDensity = Math.round(Number(fields.bubbleDensity.value));
            bubbleSpeed = Number(fields.bubbleSpeed.value);
            bubbleSize = Number(fields.bubbleSize.value);

            outputs.rayIntensity.value = rayIntensity.toFixed(2);
            outputs.bubbleDensity.value = String(bubbleDensity);
            outputs.bubbleSpeed.value = bubbleSpeed.toFixed(2);
            outputs.bubbleSize.value = bubbleSize.toFixed(2);

            rebuildWaterGradient();
            buildRaySprite();
            rebuildBubbles();
            if (shouldPersist) persist();
        }

        Object.keys(fields).forEach((key) => {
            fields[key].addEventListener('input', () => applySettings());
        });

        function resetSettings() {
            fields.waterTop.value = DEFAULTS.waterTop;
            fields.waterBottom.value = DEFAULTS.waterBottom;
            fields.rayColor.value = DEFAULTS.rayColor;
            fields.rayIntensity.value = String(DEFAULTS.rayIntensity);
            fields.bubbleDensity.value = String(DEFAULTS.bubbleDensity);
            fields.bubbleSpeed.value = String(DEFAULTS.bubbleSpeed);
            fields.bubbleSize.value = String(DEFAULTS.bubbleSize);
            applySettings(false);
            persist();
        }

        document.getElementById('reset').addEventListener('click', resetSettings);
        if (window.BGEmbed) BGEmbed.bindCopyButton(document.getElementById('copy-iframe'), currentSettings, 'Ocean');

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'Space' || event.repeat) return;
            event.preventDefault();
            menu.classList.toggle('open');
        });

        window.addEventListener('resize', resize, false);

        fields.waterTop.value = settings.waterTop;
        fields.waterBottom.value = settings.waterBottom;
        fields.rayColor.value = settings.rayColor;
        fields.rayIntensity.value = String(settings.rayIntensity);
        fields.bubbleDensity.value = String(settings.bubbleDensity);
        fields.bubbleSpeed.value = String(settings.bubbleSpeed);
        fields.bubbleSize.value = String(settings.bubbleSize);

        buildCausticStrip();
        buildBubbleSprite();
        resize();
        applySettings(false);
        requestAnimationFrame((now) => {
            lastTime = now;
            frame(now);
        });
    </script>
</body>
</html>
