<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="embed.js"></script>
    <title>Fluid Ink</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }
        #scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #home {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.6px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(8, 8, 16, 0.5);
            backdrop-filter: blur(12px);
            transition: color 0.2s ease, border-color 0.2s ease;
            z-index: 4;
        }
        #home:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        #menu {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 268px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 14px 14px 12px;
            color: #e8e8f0;
            background: rgba(8, 8, 16, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 3;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #menu header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #menu header span {
            font-size: 11px;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        kbd {
            font-size: 9px;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }
        .section {
            margin-bottom: 12px;
        }
        .section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 7px;
        }
        .bg-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .color-field span {
            font-size: 8px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.38);
        }
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 72px 1fr 36px;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label {
            font-size: 10px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
        }
        .slider-row output {
            font-size: 10px;
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #reset,
        #copy-iframe {
            width: 100%;
            margin-top: 4px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.65);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 6px 0;
            cursor: pointer;
        }
        #reset:hover,
        #copy-iframe:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        html.preview #home,
        html.preview #menu,
        html.preview #loading,
        html.embed #home,
        html.embed #menu,
        html.embed #loading {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <a id="home" href="../backgrounds.html">&#9666; GALLERY</a>
    <aside id="menu">
        <header>
            <span>SETTINGS</span>
            <kbd>SPACE</kbd>
        </header>

        <div class="section">
            <span class="section-label">INK COLORS</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="ink-a" value="#2b59ff">
                    <span>A</span>
                </label>
                <label class="color-field">
                    <input type="color" id="ink-b" value="#b02fd6">
                    <span>B</span>
                </label>
                <label class="color-field">
                    <input type="color" id="ink-c" value="#17c3b2">
                    <span>C</span>
                </label>
                <label class="color-field">
                    <input type="color" id="bg-color" value="#05070f">
                    <span>BASE</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">MOTION</span>
            <div class="slider-row">
                <label for="speed">Flow speed</label>
                <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
                <output id="speed-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="turbulence">Turbulence</label>
                <input type="range" id="turbulence" min="0" max="2" step="0.05" value="1">
                <output id="turbulence-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="contrast">Contrast</label>
                <input type="range" id="contrast" min="0.5" max="2" step="0.05" value="1.2">
                <output id="contrast-out">1.20</output>
            </div>
        </div>

        <button type="button" id="reset">RESET</button>
        <button type="button" id="copy-iframe">COPY IFRAME</button>
    </aside>

    <script>
        const STORAGE_KEY = 'bg-fluid-ink-v1';
        const HEX = /^#[0-9a-fA-F]{6}$/;

        const DEFAULTS = {
            inkA: '#2b59ff',
            inkB: '#b02fd6',
            inkC: '#17c3b2',
            bgColor: '#05070f',
            speed: 1,
            turbulence: 1,
            contrast: 1.2
        };

        function clamp(value, min, max, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        }

        function loadSettings() {
            try {
                const data = window.BGEmbed ? BGEmbed.rawData(STORAGE_KEY) : JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!data || typeof data !== 'object') return { ...DEFAULTS };
                return {
                    inkA: HEX.test(data.inkA) ? data.inkA : DEFAULTS.inkA,
                    inkB: HEX.test(data.inkB) ? data.inkB : DEFAULTS.inkB,
                    inkC: HEX.test(data.inkC) ? data.inkC : DEFAULTS.inkC,
                    bgColor: HEX.test(data.bgColor) ? data.bgColor : DEFAULTS.bgColor,
                    speed: clamp(data.speed, 0, 3, DEFAULTS.speed),
                    turbulence: clamp(data.turbulence, 0, 2, DEFAULTS.turbulence),
                    contrast: clamp(data.contrast, 0.5, 2, DEFAULTS.contrast)
                };
            } catch {
                return { ...DEFAULTS };
            }
        }

        const settings = loadSettings();

        const menu = document.getElementById('menu');
        const fields = {
            inkA: document.getElementById('ink-a'),
            inkB: document.getElementById('ink-b'),
            inkC: document.getElementById('ink-c'),
            bgColor: document.getElementById('bg-color'),
            speed: document.getElementById('speed'),
            turbulence: document.getElementById('turbulence'),
            contrast: document.getElementById('contrast')
        };
        const outputs = {
            speed: document.getElementById('speed-out'),
            turbulence: document.getElementById('turbulence-out'),
            contrast: document.getElementById('contrast-out')
        };

        function hexToRgb(hex) {
            return [
                parseInt(hex.slice(1, 3), 16) / 255,
                parseInt(hex.slice(3, 5), 16) / 255,
                parseInt(hex.slice(5, 7), 16) / 255
            ];
        }

        const state = {
            inkA: hexToRgb(settings.inkA),
            inkB: hexToRgb(settings.inkB),
            inkC: hexToRgb(settings.inkC),
            bgColor: hexToRgb(settings.bgColor),
            speed: settings.speed,
            turbulence: settings.turbulence,
            contrast: settings.contrast
        };

        function currentSettings() {
            return {
                inkA: fields.inkA.value,
                inkB: fields.inkB.value,
                inkC: fields.inkC.value,
                bgColor: fields.bgColor.value,
                speed: Number(fields.speed.value),
                turbulence: Number(fields.turbulence.value),
                contrast: Number(fields.contrast.value)
            };
        }

        function persist() {
            if (window.BGEmbed && !BGEmbed.shouldPersist) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentSettings()));
        }

        function applySettings(shouldPersist = true) {
            state.inkA = hexToRgb(fields.inkA.value);
            state.inkB = hexToRgb(fields.inkB.value);
            state.inkC = hexToRgb(fields.inkC.value);
            state.bgColor = hexToRgb(fields.bgColor.value);
            state.speed = Number(fields.speed.value);
            state.turbulence = Number(fields.turbulence.value);
            state.contrast = Number(fields.contrast.value);

            outputs.speed.value = state.speed.toFixed(2);
            outputs.turbulence.value = state.turbulence.toFixed(2);
            outputs.contrast.value = state.contrast.toFixed(2);

            if (shouldPersist) persist();
        }

        Object.values(fields).forEach((input) => {
            input.addEventListener('input', () => applySettings());
        });

        function resetSettings() {
            fields.inkA.value = DEFAULTS.inkA;
            fields.inkB.value = DEFAULTS.inkB;
            fields.inkC.value = DEFAULTS.inkC;
            fields.bgColor.value = DEFAULTS.bgColor;
            fields.speed.value = String(DEFAULTS.speed);
            fields.turbulence.value = String(DEFAULTS.turbulence);
            fields.contrast.value = String(DEFAULTS.contrast);
            applySettings(false);
            persist();
        }

        document.getElementById('reset').addEventListener('click', resetSettings);
        if (window.BGEmbed) BGEmbed.bindCopyButton(document.getElementById('copy-iframe'), currentSettings, 'Fluid Ink');

        fields.inkA.value = settings.inkA;
        fields.inkB.value = settings.inkB;
        fields.inkC.value = settings.inkC;
        fields.bgColor.value = settings.bgColor;
        fields.speed.value = String(settings.speed);
        fields.turbulence.value = String(settings.turbulence);
        fields.contrast.value = String(settings.contrast);
        applySettings(false);

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'Space' || event.repeat) return;
            event.preventDefault();
            menu.classList.toggle('open');
        });

        const canvas = document.getElementById('scene');
        const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

        const vertexSource = `
            attribute vec2 aPosition;
            void main() {
                gl_Position = vec4(aPosition, 0.0, 1.0);
            }
        `;

        const fragmentSource = `
            precision highp float;

            uniform vec2 uResolution;
            uniform float uTime;
            uniform float uTurbulence;
            uniform float uContrast;
            uniform vec3 uInkA;
            uniform vec3 uInkB;
            uniform vec3 uInkC;
            uniform vec3 uBg;

            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(
                    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
                    u.y
                );
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
                for (int i = 0; i < 5; i++) {
                    v += a * noise(p);
                    p = rot * p * 2.02;
                    a *= 0.5;
                }
                return v;
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / uResolution;
                vec2 p = (uv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0) * 3.0;
                float t = uTime * 0.06;
                float warp = 0.4 + uTurbulence * 2.0;

                vec2 q = vec2(
                    fbm(p + t * vec2(0.31, -0.24)),
                    fbm(p + vec2(5.2, 1.3) - t * vec2(0.19, 0.27))
                );
                vec2 r = vec2(
                    fbm(p + warp * q + vec2(1.7, 9.2) + t * vec2(0.13, 0.09)),
                    fbm(p + warp * q + vec2(8.3, 2.8) - t * vec2(0.10, 0.16))
                );
                float f = fbm(p + warp * r - t * vec2(0.05, 0.04));

                float ink = clamp((f - 0.5) * uContrast * 1.7 + 0.5, 0.0, 1.0);

                vec3 col = uBg;
                col = mix(col, uInkA, smoothstep(0.12, 0.86, ink));
                col = mix(col, uInkB, 0.85 * smoothstep(0.25, 0.95, clamp(length(q) * 0.72, 0.0, 1.0)));
                col = mix(col, uInkC, 0.70 * smoothstep(0.35, 0.95, clamp(r.y, 0.0, 1.0)));

                col *= 0.72 + 0.28 * smoothstep(0.1, 0.9, q.x);
                col += (uInkA + uInkB) * 0.05 * ink * ink;

                col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function makeShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, makeShader(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, makeShader(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const aPosition = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

        const uniforms = {
            uResolution: gl.getUniformLocation(program, 'uResolution'),
            uTime: gl.getUniformLocation(program, 'uTime'),
            uTurbulence: gl.getUniformLocation(program, 'uTurbulence'),
            uContrast: gl.getUniformLocation(program, 'uContrast'),
            uInkA: gl.getUniformLocation(program, 'uInkA'),
            uInkB: gl.getUniformLocation(program, 'uInkB'),
            uInkC: gl.getUniformLocation(program, 'uInkC'),
            uBg: gl.getUniformLocation(program, 'uBg')
        };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize, false);
        resize();

        let simTime = 0;
        let lastFrame = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastFrame) / 1000, 0.1);
            lastFrame = now;
            simTime += dt * state.speed;

            gl.uniform2f(uniforms.uResolution, canvas.width, canvas.height);
            gl.uniform1f(uniforms.uTime, simTime);
            gl.uniform1f(uniforms.uTurbulence, state.turbulence);
            gl.uniform1f(uniforms.uContrast, state.contrast);
            gl.uniform3fv(uniforms.uInkA, state.inkA);
            gl.uniform3fv(uniforms.uInkB, state.inkB);
            gl.uniform3fv(uniforms.uInkC, state.inkC);
            gl.uniform3fv(uniforms.uBg, state.bgColor);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
