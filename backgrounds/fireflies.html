<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (new URLSearchParams(location.search).has('preview')) {
            document.documentElement.classList.add('preview');
        }
    </script>
    <title>Fireflies</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "SF Mono", "Menlo", "Consolas", monospace;
        }
        #canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #home {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.6px;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(8, 8, 16, 0.5);
            backdrop-filter: blur(12px);
            transition: color 0.2s ease, border-color 0.2s ease;
            z-index: 4;
        }
        #home:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        #menu {
            position: absolute;
            bottom: 16px;
            left: 16px;
            width: 268px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 14px 14px 12px;
            color: #e8e8f0;
            background: rgba(8, 8, 16, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            z-index: 3;
            opacity: 0;
            transform: translateY(8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #menu header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #menu header span {
            font-size: 11px;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        kbd {
            font-size: 9px;
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }
        .section {
            margin-bottom: 12px;
        }
        .section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.4px;
            color: rgba(255, 255, 255, 0.42);
            margin-bottom: 7px;
        }
        .bg-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .color-field span {
            font-size: 8px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.38);
        }
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 72px 1fr 36px;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label {
            font-size: 10px;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
        }
        .slider-row output {
            font-size: 10px;
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #reset {
            width: 100%;
            margin-top: 4px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.65);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 6px 0;
            cursor: pointer;
        }
        #reset:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        html.preview #home,
        html.preview #menu,
        html.preview #loading {
            display: none !important;
        }
    </style>
</head>
<body>
    <a id="home" href="../index.html">&#9666; GALLERY</a>
    <aside id="menu">
        <header>
            <span>SETTINGS</span>
            <kbd>SPACE</kbd>
        </header>

        <div class="section">
            <span class="section-label">COLORS</span>
            <div class="bg-row">
                <label class="color-field">
                    <input type="color" id="glow-color" value="#d6ff7f">
                    <span>GLOW</span>
                </label>
                <label class="color-field">
                    <input type="color" id="bg-top" value="#0c1a2b">
                    <span>SKY TOP</span>
                </label>
                <label class="color-field">
                    <input type="color" id="bg-bottom" value="#04100e">
                    <span>SKY LOW</span>
                </label>
            </div>
        </div>

        <div class="section">
            <span class="section-label">FIREFLIES</span>
            <div class="slider-row">
                <label for="count">Count</label>
                <input type="range" id="count" min="10" max="200" step="1" value="60">
                <output id="count-out">60</output>
            </div>
            <div class="slider-row">
                <label for="speed">Drift</label>
                <input type="range" id="speed" min="0.2" max="3" step="0.05" value="1">
                <output id="speed-out">1.00</output>
            </div>
            <div class="slider-row">
                <label for="glow-size">Glow size</label>
                <input type="range" id="glow-size" min="0.5" max="3" step="0.05" value="1">
                <output id="glow-size-out">1.00</output>
            </div>
        </div>

        <button type="button" id="reset">RESET</button>
    </aside>
    <canvas id="canvas"></canvas>

    <script>
        const DEFAULTS = {
            glowColor: '#d6ff7f',
            bgTop: '#0c1a2b',
            bgBottom: '#04100e',
            count: 60,
            speed: 1,
            glowSize: 1
        };

        const STORAGE_KEY = 'bg-fireflies-v1';
        const HEX = /^#[0-9a-fA-F]{6}$/;

        function clamp(value, min, max, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
        }

        function loadSettings() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!data || typeof data !== 'object') return { ...DEFAULTS };

                return {
                    glowColor: HEX.test(data.glowColor) ? data.glowColor : DEFAULTS.glowColor,
                    bgTop: HEX.test(data.bgTop) ? data.bgTop : DEFAULTS.bgTop,
                    bgBottom: HEX.test(data.bgBottom) ? data.bgBottom : DEFAULTS.bgBottom,
                    count: Math.round(clamp(data.count, 10, 200, DEFAULTS.count)),
                    speed: clamp(data.speed, 0.2, 3, DEFAULTS.speed),
                    glowSize: clamp(data.glowSize, 0.5, 3, DEFAULTS.glowSize)
                };
            } catch {
                return { ...DEFAULTS };
            }
        }

        const settings = loadSettings();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;

        let glowColor = settings.glowColor;
        let bgTop = settings.bgTop;
        let bgBottom = settings.bgBottom;
        let speed = settings.speed;
        let glowSize = settings.glowSize;

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16)
            };
        }

        function layerColor(haze, darken) {
            const low = hexToRgb(bgBottom);
            const top = hexToRgb(bgTop);
            const k = 1 - darken;
            const r = (low.r + (top.r - low.r) * haze) * k;
            const g = (low.g + (top.g - low.g) * haze) * k;
            const b = (low.b + (top.b - low.b) * haze) * k;
            return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
        }

        function hash1(n) {
            const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
            return s - Math.floor(s);
        }

        function noise1(x) {
            const i = Math.floor(x);
            const f = x - i;
            const u = f * f * (3 - 2 * f);
            return hash1(i) + (hash1(i + 1) - hash1(i)) * u;
        }

        function fbm1(x) {
            return noise1(x) * 0.55 + noise1(x * 2.7 + 13.7) * 0.3 + noise1(x * 6.1 + 71.3) * 0.15;
        }

        let skyGradient = null;

        function rebuildSkyGradient() {
            skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, bgTop);
            skyGradient.addColorStop(1, bgBottom);
        }

        const TREE_DEFS = [
            { base: 0.72, amp: 0.15, freq: 0.0035, jagFreq: 0.045, jag: 0.05, haze: 0.55, darken: 0.3, seed: 11.3 },
            { base: 0.82, amp: 0.13, freq: 0.005, jagFreq: 0.06, jag: 0.045, haze: 0.25, darken: 0.55, seed: 47.9 },
            { base: 0.92, amp: 0.11, freq: 0.0068, jagFreq: 0.08, jag: 0.04, haze: 0, darken: 0.82, seed: 83.1 }
        ];

        let treePaths = [];
        let stars = [];

        function rebuildScenery() {
            treePaths = TREE_DEFS.map((def) => {
                const path = new Path2D();
                path.moveTo(-10, height + 10);
                for (let x = -10; x <= width + 10; x += 4) {
                    const ridge = fbm1(x * def.freq + def.seed) * def.amp * height;
                    const jag = Math.abs(noise1(x * def.jagFreq + def.seed * 7) - 0.5) * def.jag * height;
                    path.lineTo(x, height * def.base - ridge - jag);
                }
                path.lineTo(width + 10, height + 10);
                path.closePath();
                return path;
            });

            stars = [];
            const starCount = Math.round(width * height / 26000);
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.55,
                    radius: 0.4 + Math.random() * 0.7,
                    alpha: 0.1 + Math.random() * 0.3,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        const glowSprite = document.createElement('canvas');

        function buildGlowSprite() {
            const size = 128;
            glowSprite.width = size;
            glowSprite.height = size;
            const spriteCtx = glowSprite.getContext('2d');
            const { r, g, b } = hexToRgb(glowColor);
            const half = size / 2;
            const gradient = spriteCtx.createRadialGradient(half, half, 0, half, half, half);
            gradient.addColorStop(0, 'rgba(255, 255, 250, 0.95)');
            gradient.addColorStop(0.08, `rgba(${Math.min(255, r + 60)}, ${Math.min(255, g + 60)}, ${Math.min(255, b + 60)}, 0.9)`);
            gradient.addColorStop(0.25, `rgba(${r}, ${g}, ${b}, 0.5)`);
            gradient.addColorStop(0.55, `rgba(${r}, ${g}, ${b}, 0.14)`);
            gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
            spriteCtx.fillStyle = gradient;
            spriteCtx.fillRect(0, 0, size, size);
        }

        const fireflies = [];

        function makeFirefly() {
            return {
                x: Math.random() * width,
                y: height * (0.25 + Math.random() * 0.65),
                angle: Math.random() * Math.PI * 2,
                seed: Math.random() * 1000,
                pace: 22 + Math.random() * 26,
                depth: 0.55 + Math.random() * 0.45,
                size: 22 + Math.random() * 20,
                pulsePhase: Math.random() * Math.PI * 2,
                pulseSpeed: 0.5 + Math.random() * 1.1
            };
        }

        function rebuildFireflies(count) {
            while (fireflies.length < count) fireflies.push(makeFirefly());
            fireflies.length = count;
        }

        function drawStars(time) {
            ctx.fillStyle = '#ffffff';
            for (const star of stars) {
                ctx.globalAlpha = star.alpha * (0.7 + 0.3 * Math.sin(time * 0.8 + star.phase));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        let lastTime = performance.now();

        function frame(now) {
            requestAnimationFrame(frame);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            const time = now / 1000;

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            drawStars(time);

            for (let i = 0; i < treePaths.length; i++) {
                ctx.fillStyle = layerColor(TREE_DEFS[i].haze, TREE_DEFS[i].darken);
                ctx.fill(treePaths[i]);
            }

            ctx.globalCompositeOperation = 'lighter';
            for (const fly of fireflies) {
                fly.angle += (noise1(fly.seed + time * 0.45) - 0.5) * 4.2 * dt;
                const pace = fly.pace * speed * fly.depth;
                fly.x += Math.cos(fly.angle) * pace * dt;
                fly.y += Math.sin(fly.angle) * pace * dt * 0.75;

                if (fly.x < -40) fly.x = width + 40;
                else if (fly.x > width + 40) fly.x = -40;
                if (fly.y < height * 0.1) fly.angle = Math.PI / 2 + (Math.random() - 0.5) * 0.6;
                else if (fly.y > height * 0.97) fly.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;

                const wave = Math.sin(time * fly.pulseSpeed + fly.pulsePhase);
                const pulse = 0.1 + 0.9 * Math.pow(Math.max(wave, 0), 3);
                const drawSize = fly.size * glowSize * fly.depth * (0.75 + 0.25 * pulse);
                ctx.globalAlpha = pulse * (0.35 + 0.65 * fly.depth);
                ctx.drawImage(glowSprite, fly.x - drawSize, fly.y - drawSize, drawSize * 2, drawSize * 2);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            rebuildSkyGradient();
            rebuildScenery();
            for (const fly of fireflies) {
                fly.x = Math.min(fly.x, width);
                fly.y = Math.min(fly.y, height * 0.95);
            }
        }

        const menu = document.getElementById('menu');

        const fields = {
            glowColor: document.getElementById('glow-color'),
            bgTop: document.getElementById('bg-top'),
            bgBottom: document.getElementById('bg-bottom'),
            count: document.getElementById('count'),
            speed: document.getElementById('speed'),
            glowSize: document.getElementById('glow-size')
        };

        const outputs = {
            count: document.getElementById('count-out'),
            speed: document.getElementById('speed-out'),
            glowSize: document.getElementById('glow-size-out')
        };

        function persist() {
            if (document.documentElement.classList.contains('preview')) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                glowColor: fields.glowColor.value,
                bgTop: fields.bgTop.value,
                bgBottom: fields.bgBottom.value,
                count: Number(fields.count.value),
                speed: Number(fields.speed.value),
                glowSize: Number(fields.glowSize.value)
            }));
        }

        function applySettings(shouldPersist = true) {
            glowColor = fields.glowColor.value;
            bgTop = fields.bgTop.value;
            bgBottom = fields.bgBottom.value;
            const count = Math.round(Number(fields.count.value));
            speed = Number(fields.speed.value);
            glowSize = Number(fields.glowSize.value);

            outputs.count.value = String(count);
            outputs.speed.value = speed.toFixed(2);
            outputs.glowSize.value = glowSize.toFixed(2);

            buildGlowSprite();
            rebuildSkyGradient();
            rebuildFireflies(count);
            if (shouldPersist) persist();
        }

        Object.keys(fields).forEach((key) => {
            fields[key].addEventListener('input', () => applySettings());
        });

        function resetSettings() {
            fields.glowColor.value = DEFAULTS.glowColor;
            fields.bgTop.value = DEFAULTS.bgTop;
            fields.bgBottom.value = DEFAULTS.bgBottom;
            fields.count.value = String(DEFAULTS.count);
            fields.speed.value = String(DEFAULTS.speed);
            fields.glowSize.value = String(DEFAULTS.glowSize);
            applySettings(false);
            persist();
        }

        document.getElementById('reset').addEventListener('click', resetSettings);

        document.addEventListener('keydown', (event) => {
            if (event.code !== 'Space' || event.repeat) return;
            event.preventDefault();
            menu.classList.toggle('open');
        });

        window.addEventListener('resize', resize, false);

        fields.glowColor.value = settings.glowColor;
        fields.bgTop.value = settings.bgTop;
        fields.bgBottom.value = settings.bgBottom;
        fields.count.value = String(settings.count);
        fields.speed.value = String(settings.speed);
        fields.glowSize.value = String(settings.glowSize);

        resize();
        applySettings(false);
        requestAnimationFrame((now) => {
            lastTime = now;
            frame(now);
        });
    </script>
</body>
</html>
